name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Validator tests
        run: python3 -m unittest discover -s 90_AUTOMATION/TESTS -p 'test_*.py' -v

      - name: Run publication auditor
        run: python3 90_AUTOMATION/PIPELINES/audit_publication.py .
