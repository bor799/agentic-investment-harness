judgment:
  one_line: 极小仓本身的体量不构成违规风险，但 thesis 表达停在“AI 驱动保险科技”一句话，缺兑现阶梯、缺 H_R 隐含预期分母、缺加仓与退出条件，按当前合同只能给“不加仓 + 补研究”，而不是“升级确认仓”。
  money_source: 认知差 + 经营（双源未分离）。事前 thesis 写“长期盈利路径可能改善”，混合了基本面钱和预期差钱，但未指出当前价格已经隐含什么。
  happening_now: 案例时点（2026-02-24 买入；2026-07-15 盘中约 US$67.80，浮盈）。当前 review_date 未定义，没有 current state card，happening_now 在系统视角下为 unknown。
  strongest_support_evidence: |
    evidence_used 中包含 LMND 深度研究底稿 v2（2026-04-30）和 Q4 2025 / Q1 2026 财报八维分析两份独立时点证据；多家外部研究路径覆盖 AI 保险科技叙事；
    H_B 路径上“承保 + 理赔数字化”是 GROWTH_TECH 兑现阶梯上“需求→付费客户→收入”这一段的合理叙事起点。
  strongest_counter_evidence: |
    evidence_missing 自报：连续 GLR、GAAP OCF/FCF、费用与客户单位经济、SBC 稀释、Hannover Re 协议细节全部缺失。
    按 GROWTH_TECH 兑现阶梯，这等于在“毛利 / take rate → 经营费用与 SBC → OCF → FCF → 完全稀释每股价值”链条上缺了四步；H_B 现在只能是 mixed/unknown，不能 pass。
    按 EXPECTATIONS_VALUATION，市场当前在“市梦率”语法下，没有写 market_implied_expectation 与 reality_needed_to_justify_price；H_R 未校准。
  key_unknown: |
    1) 当前价格 US$67.80 隐含了多少保费增速、综合成本率（GLR）和 FCF 转正时点？
    2) Hannover Re 协议是否限制 LMND 承保杠杆上限，从而封死“经营杠杆释放”这条路径？
    3) 仓位意图到底是探索、验证还是没信心？案例本身自陈“研究深度与仓位意图不清”。
  action: 不加仓
  next_verification_signal: |
    连续 2 个季度的 GLR（事故率 + 费用率）< 100 且趋势改善；
    GAAP OCF 单季度转正或单季度 FCF 亏损收窄 >= 30%；
    Hannover Re 协议续约条款 / 比例变化；
    SBC 占收入比同比下降；
    这些信号出现前不允许升级到“建立验证仓/确认仓”。
  H_B: mixed
  H_R: unknown
  H_L: unknown
  H_C: pass
  failure_condition: |
    连续 2 个季度 GLR > 100 且无费用率改善；
    GAAP OCF 持续为负且环比扩大；
    Hannover Re 续约时大幅削减比例或要求保单重组；
    SBC 占收入比上行；
    任一触发 → 降级或退出。

