judgment:
  one_line: >-
    一个"未追价"的正向过程样本——价格纪律阻止了 FOMO，但 39.2 元锚本身未经验证，旧储能/电解液框架在现金流和应收存货上仍未闭环。
  money_source: >-
    事件跳变钱（H1 预告 + Q3 排产）+ 周期利润修复钱 + 市场低估利润持续性的认知差钱；不是稳定现金流资产的钱。
  happening_now: >-
    部分发生：储能招标 + H1 预告利润穿透已兑现，但现金流 / 应收 / 存货 / 单吨利润尚未在正式中报落地，Q3 排产证据为产业链口径而非公司正式披露。
  strongest_support_evidence: >-
    天赐 H1 预告归母 27-30 亿、同比 +907%-1019%；6 月电解液和六氟产能利用率接近满产；7 月排产约 9.32 万吨、环比 +10.95%、高于行业平均 +6.8%；储能招标链仍在。
  strongest_counter_evidence: >-
    Q1 经营现金流仍为负、应收账款和存货增长较快；行业接近成本线、出现"盈利倒挂"；六氟 9.5-10.0 万元/吨仅维持、未现趋势性涨价；H1 现金流和毛利率均未正式披露。
  key_unknown: >-
    H1 正式中报的三个数字：经营现金流是否转正、应收/存货增速是否放缓、毛利率是否守住 30%-33%。
  action: 继续观察
  next_verification_signal: >-
    2026-08-21 附近正式中报披露日的现金流、应收、存货、毛利率；同时关注资金连续 2 日净流入 + 滚动 3 日合计转正是否出现。
  H_B: unknown
  H_R: unknown
  H_L: unknown
  H_C: unknown
  failure_condition: >-
    正式 H1 利润强但经营现金流继续明显为负；应收/存货继续快于收入；六氟持续跌破 8-9 万元/吨；Q3 利润明显低于 Q2；价格放量跌破 33.41 元且资金连续净流出。

