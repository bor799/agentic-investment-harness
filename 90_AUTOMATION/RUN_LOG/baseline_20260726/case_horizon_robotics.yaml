  one_line: 已建仓浮盈中，业务票据 H_B 仍未过——加仓不合法，本轮回chat_only不加仓。
  money_source: 基本面钱（HSD/平台软件收费权兑现）+ 认知差钱（市场仍按"智驾芯片供应商"定价）。
  happening_now: 持仓 11,400 股 @ HK$4.10 已存在；浮盈约 7.80%；价格回升但产品毛利、研发费用率、调整亏损与 OCF 尚未独立披露验证。
  strongest_support_evidence: 旧 dossier 中 2025 ADAS 计算芯片份额 47.66%（第一）、城区 NOA 份额 17.88%（第三）、Journey 车规硬件出货 401 万套、ASP +75%、Starry 6 已发布获十余家车企合作意向——产业位置与出货节奏真实。
  strongest_counter_evidence: 2025 产品方案毛利率从 46.4% 降至 34.5%、R&D/收入 137.1%、调整净亏损 RMB 28.12 亿、经营现金流仍为负——兑现阶梯在"收入→毛利→亏损收窄→现金流"段断链。
  key_unknown: 1H26 全文财报三项硬数——产品方案毛利率是否修复 ≥38%、研发费用率是否下行、调整亏损是否由扩转收。
  action: 不加仓
  next_verification_signal: 2026 H1 全文业绩公告（预计 2026-08 下旬）三硬数同向验证；Starry 6 首个主流车企正式定点+SOP。
  H_B: unknown
