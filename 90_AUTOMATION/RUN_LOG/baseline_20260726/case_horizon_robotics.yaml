self_critique:
  hindsight_contamination: low
  hindsight_notes: |
    严格遵守 BASELINE 规则——只使用 pre_decision_context / thesis_before_action / evidence_used /
    evidence_missing / emotion_or_state / method_version 六个字段。
    未读取 actual_result / what_changed / what_would_have_prove_wrong / lesson_type / write_to。
    "浮盈约 7.80%" 来自 pre_decision_context（许可字段），不构成将价格验证误当业务验证的依据。
    判断 H_B unknown / H_R fail / action 不加仓 是 GROWTH_TECH + 四票自然推导结果，非事后归因。
    未引用 2026-07-21 Positive Profit Alert 的 attempt 2 纠正（调整亏损扩大 5.1%-27.6%）——
    那是 case 文件日期 2026-06-24 之后才发生的事件，若使用即属 hindsight 污染。
  shallow_areas:
    - "未独立验证当前 P/S 倍数与未盈利科技股坏情景下沿的赔率距离——H_R 标 fail 但缺少定量安全边际数字（HK$3.0-HK$3.6 区间或对应 P/S 8-10x）。"
    - "未拆解 OEM 自研芯片（BYD 模式）扩散概率与时间窗——这是 H_B 最大单一风险但未给出可监测信号。"
    - "未给出 grandfathered 框架下'换仓或减险'的具体执行清单——H_C 已 pass 但未提示超限仓位的减险路径。"
    - "未列 Starry 6 主流车企定点的产业跟踪信号源（GGII/高工装机数据、车企 SOP 公告）。"
  missing_experience:
    - 未与同级未盈利智驾公司（Mobileye、黑芝麻、英飞凌 ADAS 部门）做横向 P/S 与毛利率对照。
    - 未把"车企自研 vs 第三方芯片"产业分裂情景写成可证伪的分叉树。
    - 港股未盈利科技股 1H 财报发布前后的历史波动率与赔率经验未调用。
  incongruences:
    - "case 文件 emotion_or_state = '浮盈状态，容易把价格验证误当业务验证' 与 method_version = '旧智驾/平台收费权框架' 在时间上略有错配：浮盈出现在 7-15，但 thesis 在 6-24 形成——case 的 pre_decision_context 横跨了两周时间，导致状态字段的'决策时点'不清晰。"
    - "evidence_used 写'company_research、价格胜率、护城河验证和单日大涨归因'，但 evidence_missing 同时列产品毛利/软件占比/研发费用率/OCF——这说明买入决策本身就是建立在'产业位置+出货节奏'上而非'利润兑现'上，与 GROWTH_TECH 兑现阶梯不完全一致；BASELINE 应标注这是 thesis-level 而非 evidence-level 的买入。"
  template_correct_but_hollow: |
    本 BASELINE 输出结构完整、四票齐全、Reviewer verdict 合法，但存在两层 hollow：
    (1) H_R 标 fail 缺少"赔率改善触发价格"或"P/S 倍数目标"定量锚；
    (2) H_B 标 unknown 但未给出"在 1H26 财报前是否允许小幅验证仓换仓"的悬置容器（suspended container）配置。
    这两点是 distillation 后版本应补强的方向，不属本次 BASELINE 缺陷。
