judgment:
  one_line: 自有 IP 平台 + 已落地的爆发性财务（2025 营收 +184.7%、净利 +308.8%、海外 43.8%）构成一条值得追踪的稀缺性 thesis，但当前价格（约 HK$200+）相对未来现金流的估值区间未被校准，事前不构成"建立验证仓"。
  money_source: 认知差钱 + 经营基本面钱（自有 IP 控制权溢价尚未被与联名 IP 拉开足够估值差距）
  happening_now: 是——2025 财报已爆发，海外收入占比从早期跳到 43.8%，变化正在兑现中
  strongest_support_evidence: 17 个 IP 收入过亿 + 自有 IP 矩阵（Labubu、Molly）+ 2025 营收同比 +184.7%、净利润 +308.8%——这不是叙事，而是已经穿透到收入和净利润的经营证据
  strongest_counter_evidence: 200+ 港元隐含的市场预期已包含高增长持续期；海外直营在欧美和东南亚的可复制性、单店模型持续性、IP 长尾现金流的可贴现性都没有独立证据
  key_unknown: 自有 IP 的"长尾现金流贴现值"——它能否像迪士尼或三丽鸥那样把单 IP 现金流延续 7-15 年，还是更接近时尚周期（2-4 年）
  action: 继续观察
  next_verification_signal: 下一份财报中海外收入同店/单店盈利模型 + 新 IP 收入贡献占比 + 毛利率走势；以及相对未来现金流反推的合理估值区间
  H_B: pass
  H_R: unknown
  H_L: mixed
  H_C: unknown
  failure_condition: 海外单店模型持续亏损或老 IP 收入塌方 + 新 IP 接不上 + 经营现金流与利润背离

