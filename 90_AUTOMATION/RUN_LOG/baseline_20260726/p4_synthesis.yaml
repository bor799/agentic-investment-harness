# ============================================================
# 2. CONFLICTS — 跨文章互相矛盾
# ============================================================
conflicts:
  - conflict_id: X-001
    description: >
      "等待 / 耐心"在不同文章中被赋予相反的合法性。
      一组（泊松 / 忍受悬而未决 / 三大数学模型 poisson）主张合法等待是高手的纪律；
      另一组（同样来自泊松 + 赚谁的钱）警告"等待时长"可被用来包装资本钝化和逃避。
    sides:
      - unit: 忍受悬而未决:tolerate-uncertainty-001
        position: 主动延长关门时间通常是好决策
      - unit: 投资是泊松过程:poisson-012
        position: 低 λ + 低证据密度 + 低赔率的"等待"是资本钝化
      - unit: 投资是泊松过程:poisson-004
        position: 等待时长本身不改变未来到达速率（无记忆性）
    resolution_proposal: >
      不存在真正矛盾——核心变量是"λ 是否在上升 + falsifier 是否定义"。
      canonical 应在 BEHAVIOR_REVIEW 中显式写出"合法等待的 3 个充要条件"：
      (a) 命名等待的具体事件；
      (b) falsifier 与 review clock 已写；
      (c) 证据斜率或 λ 至少有一项不在持续下降。
      三项任一不满足，"等待"自动降级为"钝化"。

  - conflict_id: X-002
    description: >
      "幂律赢家"识别与"追涨 = 接盘"之间存在张力。
      math-power 系列主张给右尾资产合法大仓位；
      math-bayes-006 / stock-three-layer-004 主张价格已过度反映时加仓即追涨。
    sides:
      - unit: 三大数学模型:math-power-004
        position: 右尾出现时给足合法仓位
      - unit: 三大数学模型:math-bayes-006
        position: 价格已过度反映后验时加仓是追涨
      - unit: 三大数学模型:math-power-002
        position: 用平均估值看幂律赢家会系统性误判
    resolution_proposal: >
      核心判别是"价格反映的是过去后验还是未来状态迁移的剩余空间"。
      math-power-003 七项结构条件作为前置闸门——只有七项条件 ≥ 5 项成立时，
      才允许使用幂律仓位勇气；否则按 bayes-006 执行。

  - conflict_id: X-003
    description: >
      "立即行动获取信息"（双向门快速试错） vs "延长关门时间"（单向门耐心）。
    sides:
      - unit: 忍受悬而未决:tolerate-uncertainty-005
        position: 双向门应快速行动，悬置是错配
      - unit: 忍受悬而未决:tolerate-uncertainty-001
        position: 单向门应延长关门时间
    resolution_proposal: >
      非矛盾——同一篇文章内部已通过"单/双向门"分类消解。
      canonical (02_CAPITAL_AND_EXECUTION) 已有该分类，无需新增；
      但需要在 BEHAVIOR_REVIEW 增加显式判别清单（投资场景下双向门的具体例子）。

