    （2）AIC-005（必经≠好投资）几乎是 STRUCTURAL_CHANGE_BOTTLENECK "不能证明什么" + INDUSTRY_SUPPLY_DEMAND "供给反噬时钟" 的具体化；
    （3）AIC-003（瓶颈定位启发式）与 STRUCTURAL_CHANGE_BOTTLENECK "七步瓶颈测试" + "九步漏斗" 部分重叠，但本文给出了基于"集群规模档位 + 工程参数边界"的快捷定位法，属增量；
    （4）AIC-002（价值分配沿链迁移）属本文新增角度，canonical 中未明确表达；
