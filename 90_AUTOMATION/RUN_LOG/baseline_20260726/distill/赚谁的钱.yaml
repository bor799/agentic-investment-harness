article_id: 赚谁的钱
article_path: /Users/murphy/Documents/Obsidian Vault/Clippings/一个大多数人从未问过的问题，你赚的到底是谁的钱.md
article_dominant_type: principle
article_one_line: 二级市场主动交易是零和博弈，每一笔利润都来自对手方在特定约束下的非最优决策；可持续获利的必要前提是回答"我赚的是哪种钱、谁在亏、他为什么不得不亏"。

distilled_units:

- unit_id: money-source-001
  type: principle
  claim: 短期二级市场主动交易本质上是零和（扣费后负和），你赚的每一块钱必然对应对手方亏的同一块钱。
  mechanism: 二级市场短期交易不创造新价值（与餐厅把原料变成菜不同），价格变动只在不同持有人之间重新分配财富，扣除手续费后总财富减少。
  prerequisites:
    - 标的是已发行的金融资产（股票/期货/外汇/加密货币的二级市场）
    - 持有期短到企业本身没有创造明显增量价值
    - 主动换手（不是长期持有优质资产）
  invalid_conditions:
    - 长期持有持续产生利润的优质公司（这是正和，接近企业经营的价值分享，本文明确排除）
    - 一级市场/天使投资（投资行为本身注入资本给企业）
    - 经营性资产（餐厅、农场等创造新价值的经济活动）
  signals:
    - "你打算持有的时间尺度相对于企业价值创造周期过短"
    - "你的收益不依赖企业利润增长，只依赖价格变动"
  counter_view: 长期持有优质资产是正和博弈——企业持续创造利润反映为股价上涨，这种钱不是从对手方手里抢的，而是企业自身创造的价值分享。
  confidence: high
  empirical_support: 文章以零和博弈的数学定义作为公理陈述，未给具体实证；负和部分由交易费用（手续费、滑点）必然存在推出。
  source_refs: { article: 你赚的是谁的钱, location: "零和、负和与正和 段（行30-34）" }
  decision_use: 收益来源识别
  forbidden_inference: 不能据此推论"长期持有一定赚钱"——长期持有优质企业是正和，但选错企业仍是负和；也不能推论"短期交易一定亏"——零和中确有少数人可持续获利，关键是后文四种钱的分类。
  draft_state: candidate

- unit_id: money-source-002
  type: principle
  claim: 主动交易的每一笔利润都来自对手方的非最优决策；分类"赚谁的钱"必须以"对手方为什么犯错"为标准。
  mechanism: 零和市场中获利等价于对手方亏损，对手方亏损等价于他做了非最优决策；不同的"非最优决策原因"通向完全不同的生意。
  prerequisites:
    - 你已确认自己在做主动交易（不是长期持有）
    - 你愿意追问"对面是谁、他为什么亏"
  invalid_conditions:
    - 你只是"凭感觉"买卖，从未思考过对手方
    - 你在赌场式纯随机中博弈（没有结构性对手方错误可识别）
  signals:
    - "无法用一句话说清'我赚的是__情况下__群体因为__原因不得不做的非最优决策的钱'"
  counter_view: 有效市场中所有公开信息已反映在价格上，长期看没有人能系统性赚对手方的钱（EMH）——但文章立场是市场参与者存在系统性偏差，EMH 在短期内不严格成立。
  confidence: high
  empirical_support: 框架性论断，由后续四种钱（处置效应实证、指数再平衡案例、2020 熔断案例）共同支撑。
  source_refs: { article: 你赚的是谁的钱, location: "四种钱 段开头（行38-40）" }
  decision_use: 收益来源识别
  forbidden_inference: 不能推论"只要我能描述对手方错误我就一定能赚"——描述只是必要条件，不是充分条件；还要经过可证伪假说和回测验证。
  draft_state: candidate

- unit_id: money-source-003
  type: mechanism
  claim: 处置效应（过早卖盈、过久扛亏）是人类心理架构的硬件级偏差，不是知识问题；只要人类还在做交易决策，由它驱动的定价偏离就会持续产生。
  mechanism: >
    卖出盈利股→确认"我做对了"→获得心理奖励；
    卖出亏损股→承认错误→把账面浮亏变成真实损失→心理痛苦。
    进化环境中"渴望确认正确/厌恶承认错误"是有用的特征，但在交易中系统性导致
    P(winners sold) > P(losers sold) → 被卖出的盈利股后续跑赢被保留的亏损股。
  prerequisites:
    - 对手方是自然人（人或由人组成的非严格量化委员会），不是纯算法/做市商
    - 持仓账户按市价估值（让"浮亏"成为心理负担）
    - 个人账户/散户/小型机构主导的市场（处置效应在大资金中较弱）
  invalid_conditions:
    - 对手方是纯量化系统/规则驱动的被动基金（无心理痛苦）
    - 市场完全由 HFT 和被动指数构成（人主导的偏差被套利掉）
    - 持有人完全无杠杆且对自己无复盘情绪反应（极端自律者）
  signals:
    - "你正在散户密集的市场/标的里"
    - "你观察到某资产被卖出后未发生基本面恶化"
    - "持仓结构数据显示浮盈股被显著减仓、浮亏股被显著保留"
  counter_view: 高频/机构化市场会持续消除这种偏差；交易经验丰富者处置效应可能更弱。但 Odean 后续研究显示：活跃交易者的处置效应有时反而更强——经验不免疫硬件偏差。
  confidence: high
  empirical_support: >
    Shefrin & Statman (1985) 理论预测；
    Odean 利用大型折扣券商 1987-1993 近一万个散户账户完整交易记录验证：
    被卖出的盈利股在卖出后 12 个月平均跑赢被保留的亏损股 3.4 个百分点；
    多国多市场跨时间段复制研究结论相似。
  source_refs: { article: 你赚的是谁的钱, location: "第一种钱 段（行42-68）" }
  decision_use: 收益来源识别
  forbidden_inference: 知道处置效应存在不等于能从中获利——你还需要（a）识别哪个标的的处置效应正显著发生（b）度量其强度（c）确认对手方不是反向套利者；不能凭"散户会犯这个错"就买浮亏股。
  draft_state: candidate

- unit_id: money-source-004
  type: heuristic
  claim: 赚"过度反应的钱"的核心能力不是"敢在别人恐慌时买入"这种口号，而是能独立评估基本面、区分"价格偏离了价值"与"价格正确反映了恶化的价值"。
  mechanism: >
    过度反应 vs 合理反应的区分点 = 价格下跌是否有基本面恶化支撑。
    有基本面恶化支撑 → 合理反应（买入会归零，雷曼案例）；
    无基本面恶化支撑 → 过度反应（买入有回归收益）。
  prerequisites:
    - 你具备对目标资产进行独立基本面估值的能力（不是看 K 线/听消息）
    - 你能在恐慌中执行分析（情绪/时间允许）
    - 你有合理的估值锚（即使粗糙）
  invalid_conditions:
    - 资产根本没有可估的"基本面"（如纯投机 token、无盈利可言的 meme 股）
    - 你的估值锚与市场价格本身同源（你的"基本面"也是市场共识的复读）
    - 信息不透明、你无法判断下跌是因为基本面恶化还是其他原因
  signals:
    - "下跌催化剂是基本面事件（财报、破产、监管）还是流动性事件（margin call、指数剔除）"
    - "下跌幅度相对于基本面变化的偏离度（一个量化偏离的代理变量）"
    - "下跌速度/成交量异常（流动性事件通常有可识别的成交量特征）"
  counter_view: 即使做了基本面分析，你仍可能因为信息不全而误判——雷曼下跌时很多人确实做了基本面分析，但他们不知道表外资产的真实情况。
  confidence: high
  empirical_support: 2008 年雷曼从 60 美元跌到 1 美元；跌到 30 美元时大量"过度恐慌"判断者买入后全部归零（合理反应案例，反例）。
  source_refs: { article: 你赚的是谁的钱, location: "第一种钱 段末（行64-68）" }
  decision_use: 行为阀
  forbidden_inference: 不能反向推论"基本面没恶化就一定能买"——还要考虑流动性/估值/仓位；也不能推论"我有基本面分析能力"——大多数业余者的"基本面"是市场共识复读。
  draft_state: candidate

- unit_id: money-source-005
  type: principle
  claim: 第二种钱（结构性约束驱动的非最优交易）是"聪明人被迫做蠢事"，是最可靠的获利来源，因为结构性约束不会因意识到而消失。
  mechanism: >
    某类市场参与者（指数基金、保险、公募、抵押贷款机构）的运作规则、合规要求、组织授权范围
    强制他们在特定条件下执行非最优交易（如指数再平衡必须按规则买卖、保险大灾后必须卖债筹资）；
    他们完全知道自己在做什么不最优，但他们的目标是追踪指数/合规/应对赎回，不是最大化单笔交易利润；
    制度约束 → 强制买卖 → 短期价格偏离 → 偏离部分回归。
  prerequisites:
    - 存在一类被规则/合规/授权约束的参与者，他们的目标函数 ≠ 单笔交易利润最大化
    - 你能识别这些参与者何时必须行动（事件日历可观测，如指数调整日）
    - 强制交易的规模相对于标的市场足够大，能产生可观测的价格冲击
  invalid_conditions:
    - 你想做对手方的资产没有可识别的强制交易方
    - 强制交易已被广泛知晓且竞争者提前布局，价格冲击已被套利消化
    - 你自己也处于类似约束（你也不能持有到期回归）
  signals:
    - "标普 500 等指数调整的提前公布日期与剔除/纳入名单"
    - "大型自然灾害后保险板块的债券抛售"
    - "公募基金季度末持仓粉饰（买入近期赢家、卖出近期输家）"
    - "利率变动引发的抵押贷款对冲操作"
  counter_view: 越来越多套利者涌入指数再平衡套利后，超额收益被压缩；事件套利空间是衰减的。
  confidence: high
  empirical_support: 文章以标普 500 指数基金强制再平衡、保险大灾后卖债、公募季度末粉饰、抵押贷款机构利率对冲为典型案例；未给具体回测数据。
  source_refs: { article: 你赚的是谁的钱, location: "第二种钱 段（行70-80）" }
  decision_use: 收益来源识别
  forbidden_inference: 不能推论"所有结构性约束都可套利"——若约束方规模小或事件不可预测（如保险大灾日期不可知），实际可操作性低；也不能推论"可观测事件就一定有套利空间"——竞争者早已介入。
  draft_state: candidate

- unit_id: money-source-006
  type: principle
  claim: 第三种钱（信息处理速度差异）对个人交易者几乎不存在；正确的策略是知道它在哪、然后绕开。
  mechanism: 同一公开信息发布后，HFT 用几亿美元铺设微波塔把反应时间从毫秒压到微秒，个人交易者反应以分钟/小时计；时间差内价格已移动，无优势。
  prerequisites:
    - 信息是公开的（不是内幕）
    - 速度差异转化为价格移动（标的对信息敏感）
  invalid_conditions:
    - 信息发布后短期价格不敏感（如冷门小盘股、长期限衍生品）
    - 你获取信息的渠道与 HFT 同步（极少见）
  signals:
    - "标的是高流动性、对宏观信息敏感的资产（这些资产上 HFT 优势最大）"
    - "你的下单延迟 > 秒级"
  counter_view: 在流动性差、对即时信息不敏感的市场（如某些小盘、长久期、特殊机会），速度差异不那么重要，个人交易者反而有优势。
  confidence: high
  empirical_support: 文章陈述 HFT 投入几亿美元铺微波通信塔，将传输从毫秒压到微秒（行业事实）。
  source_refs: { article: 你赚的是谁的钱, location: "第三种钱 段（行82-88）" }
  decision_use: 行为阀
  forbidden_inference: 不能推论"个人交易者在所有市场都没有速度优势"——在冷门/低流动性/特殊机会资产上，机构不重视，个人反而可以慢慢研究；也不能把"绕开速度战"等同于"不需要及时"。
  draft_state: candidate

- unit_id: money-source-007
  type: mechanism
  claim: 第四种钱（时间框架错配）是个人交易者最有可能赚到的钱；前提是真正拥有比对手方更长的时间框架，且这一前提远比口头声称的难。
  mechanism: >
    不同参与者有不同时间框架（日内/季度/20 年养老）；
    短期约束方（margin call、基金赎回、风控止损）在长期价值未变时被迫抛售；
    长时间框架方（无杠杆、现金充裕、不向任何人交代季度业绩）可以低位买入并等待价值回归。
  prerequisites:
    - 你真正没有短期现金流压力（无杠杆、无强制赎回义务）
    - 你不需要向任何人交代季度业绩
    - 你能区分"价格低于合理价值"和"价值本身恶化"（与 money-source-004 同）
    - 你有基于独立分析的、可辩护的估值判断（不是"我相信它会涨回来"的信念）
  invalid_conditions:
    - 你有杠杆 → 即使判断对也会被短期波动清算
    - 你管理他人资金且有定期赎回窗口
    - 你的"长期"只是"短期被套后的被动延展"（事后合理化）
    - 资产本身在恶化（你把"价值陷阱"误认为时间框架错配）
  signals:
    - "市场层面：VIX/资金费率/未平仓合约量显示被迫平仓正在发生"
    - "个股层面：下跌伴随成交量异常放大且无对应基本面恶化"
    - "你的资金状态：无杠杆、现金充裕、无外部赎回压力"
  counter_view: 长期持有等待回归的机会成本可能很高；"长期"在通胀/复利意义上不便宜；有些资产永远不会回归（价值陷阱）。
  confidence: high
  empirical_support: 2020 年 3 月新冠崩盘，优质公司几周内跌 30%-50%，无杠杆、现金充裕、不交代季度业绩的参与者在随后 1-2 年获得显著回报；卖出方多因 margin call、赎回、风控止损被迫抛售。
  source_refs: { article: 你赚的是谁的钱, location: "第四种钱 段（行90-98）" }
  decision_use: H_L
  forbidden_inference: 不能推论"跌 30% 就该买"——前提是确认下跌原因是短期约束而非基本面恶化（雷曼教训仍适用）；也不能把"我有耐心"等同于"我有更长的时间框架"——耐心是心理属性，时间框架是结构属性。
  draft_state: candidate

- unit_id: money-source-008
  type: heuristic
  claim: 用一句话填三个空来诊断交易是否有逻辑基础——"我赚的是__情况下__群体因为__原因不得不做的非最优决策的钱"；三个空都填不上 = 你不知道自己在赚谁的钱。
  mechanism: >
    强制结构化思考：必须明确(1)触发条件 (2)对手方群体 (3)对手方为何非最优。
    三个空缺任一 → 缺少对手方画像 → 你赚的可能是随机波动 → 早晚以不知道为什么亏的方式还回去。
  prerequisites:
    - 你愿意在出手前做这次结构化自问
    - 你对对手方有基本识别能力（知道市场上有哪些类型的参与者）
  invalid_conditions:
    - 你做的是被动指数投资/定投（不需要回答对手方问题）
    - 你做的是真正的长期价值投资（赚的是企业创造的价值，不是对手方的非最优决策，参见 money-source-001 的 counter_view）
  signals:
    - "三个空都填不上 → 不要出手"
    - "能填上但经不起追问（如'散户为什么追涨杀跌？什么条件下达到可利用的极端？怎么度量？'）→ 还在表面"
    - "能填上且经得起追问 → 进入可测试假说阶段"
  counter_view: 部分经验型交易者（如做市、套利）依赖直觉和长期模式识别，未必能清晰填三空，但仍可持续盈利。
  confidence: medium
  empirical_support: 框架性启发，文章未给回测；逻辑自洽但缺乏独立的实证验证。
  source_refs: { article: 你赚的是谁的钱, location: "一个诊断性的问题 段（行100-110）" }
  decision_use: 行为阀
  forbidden_inference: 不能推论"能填上三空就一定能赚"——这只是必要条件；下一步还要把假说变成可度量信号并回测验证。
  draft_state: candidate

- unit_id: money-source-009
  type: mechanism
  claim: 判断必须翻译成可观测的数据 + 预定义的阈值，否则无法检验、无法复制、无法在状态差时替你决策。
  mechanism: >
    两步翻译：(1)找到一个或一组可观测数据度量"缺陷"是否正在发生（看什么）；
    (2)定义一个阈值判断"缺陷"是否达到值得出手的极端程度（什么时候动手）。
    翻译后，"我觉得市场太恐慌"变成"VIX 处于过去十年仅 10% 时间才出现的水平"，后者可回测，前者不能。
  prerequisites:
    - 你已经能清晰描述要赚的是哪种钱（money-source-008 通过）
    - 该缺陷确实有可观测代理变量（不是纯主观判断）
    - 有历史数据可用来设定阈值百分位
  invalid_conditions:
    - 缺陷无公开可观测代理变量（如某些主观政策判断）
    - 历史数据太短无法设定有意义的百分位
    - 市场结构剧烈变化导致历史百分位失效
  signals:
    - "VIX 相对历史水平百分位（恐慌类）"
    - "指数调整日期 + 受影响名单 + 历史回归幅度统计（结构性约束类）"
    - "期货未平仓合约量 + 资金费率 + 交易所稳定币流入流出（杠杆风险类）"
  counter_view: 经验丰富的交易者的直觉有时优于粗糙指标——粗糙指标可能漏掉关键上下文。
  confidence: medium
  empirical_support: 文章给三个例子（VIX、指数调整统计、加密杠杆指标）作为示意，未提供独立回测结果。
  source_refs: { article: 你赚的是谁的钱, location: "从判断到数字 段（行112-134）" }
  decision_use: H_C
  forbidden_inference: 不能推论"指标越精确越好"——文章明确警告追求精确在此阶段有害（见 money-source-010）；也不能推论"有指标就一定能赚"——指标只是把假说可检验化，是否赚钱还要看假说本身。
  draft_state: candidate

- unit_id: money-source-010
  type: heuristic
  claim: 在把判断转化为数字的阶段，追求精确是有害的；粗糙但逻辑正确远胜于精确但逻辑错误。
  mechanism: >
    精确优化常发生在逻辑未验证的参数上（小数点后四位）；
    而真正的关键问题（赚的是谁的钱）从未被验证；
    结果：在错误逻辑上叠加精确参数，反而强化了过拟合和自信心。
  prerequisites:
    - 你正在把假说翻译成可度量信号
    - 你尚未验证底层逻辑
  invalid_conditions:
    - 逻辑已经过验证，进入参数优化阶段（此时追求精确是合理的）
    - 高频/做市类策略（精度本身是核心竞争优势）
  signals:
    - "你花了几个月用机器学习优化参数到小数点后四位"
    - "你从未验证策略背后的'赚谁的钱'逻辑是否成立"
  counter_view: 在已验证逻辑的策略上，参数优化确实能带来边际改进；本文针对的是逻辑未验证阶段的过早精确化。
  confidence: medium
  empirical_support: 文章作为观察性经验陈述，无具体回测对比。
  source_refs: { article: 你赚的是谁的钱, location: "从判断到数字 段末（行132-134）" }
  decision_use: 行为阀
  forbidden_inference: 不能推论"粗糙永远比精确好"——只在逻辑验证阶段如此；逻辑确认后精确化是正常的工程改进。
  draft_state: candidate

- unit_id: money-source-011
  type: anti_pattern
  claim: 混淆"回测有效"与"逻辑成立"是业余交易者最常见的错误；正确顺序是先有逻辑，再用数据验证。
  mechanism: >
    在足够大的数据集中测试足够多的参数组合，几乎一定能找到看起来完美的曲线（纯统计巧合）；
    人类大脑天生擅长在随机中发现模式（进化优势在金融市场反而成陷阱）；
    先数据后解释 = 事后编故事 = 过拟合。
  prerequisites:
    - 你在历史数据中发现了某种"看起来有效"的模式
    - 你拥有可调参的工具（机器学习、参数扫描）
  invalid_conditions:
    - 你已经有清晰的因果逻辑，回测只是验证（这是正确顺序，不是 anti-pattern）
  signals:
    - "你说不清'我赚的是谁的钱'但回测曲线很漂亮"
    - "你测试了几十/几百组参数后挑出最好的一组"
    - "你对回测有效模式的解释是事后构造的"
  counter_view: 数据驱动的发现（data-driven discovery）在某些领域（如因子投资的部分因子）确实产出了事后才有理论解释的稳健 alpha；先数据后理论不必然错误，但需要更严格的样本外验证。
  confidence: high
  empirical_support: 文章作为方法论陈述，引用进化心理学解释人类模式识别偏差；未给具体交易策略的过拟合案例数据。
  source_refs: { article: 你赚的是谁的钱, location: "一个容易犯的错误 段（行136-144）" }
  decision_use: 行为阀
  forbidden_inference: 不能推论"所有数据驱动的发现都是过拟合"——关键是样本外验证和多重假设校正；也不能推论"先有逻辑就一定对"——逻辑可能本身错误，仍需数据验证。
  draft_state: candidate

- unit_id: money-source-012
  type: principle
  claim: 一个可证伪的假说（A 条件下 B 群体因 C 原因非最优决策 → D 指标达 E 阈值 → 做 F → 预期 G）不保证赚钱，但能让你在亏钱时区分逻辑错/执行错/运气差，三种情况需要完全不同的应对。
  mechanism: >
    假说中每个变量可独立检验：A 是否真的出现、B 是否真的那样反应、D 是否真的捕捉到反应、E 阈值是否合理、G 是否有统计显著性；
    亏损发生时可定位是哪一环失效，避免盲目调参。
  prerequisites:
    - 你已按 money-source-008/009 把交易整理成可证伪假说
    - 你愿意按变量逐项检验而不是整体丢弃
    - 你能区分逻辑错、执行错、运气差
  invalid_conditions:
    - 假说中变量无法独立检验（如多个变量纠缠在一起）
    - 样本量太小无法做统计显著性判断
    - 你拒绝承认假说可能错（自我欺骗）
  signals:
    - "亏损后你能定位是 A/B/D/E/G 哪一环失效"
    - "你的下一步修改是针对性的，而不是'再调一组参数试试'"
  counter_view: 真实市场有反身性（Soros），假说本身可能影响市场从而改变自己的有效性；变量之间的耦合可能无法完全解耦检验。
  confidence: high
  empirical_support: 文章作为方法论陈述，未给具体策略案例的拆解数据。
  source_refs: { article: 你赚的是谁的钱, location: "这两步能给你什么 段（行146-156）" }
  decision_use: H_R
  forbidden_inference: 不能推论"有可证伪假说就一定能赚"——它只是把交易从赌博变成可改进的生意；后路仍需风控、仓位、执行纪律。
  draft_state: candidate

- unit_id: money-source-013
  type: case_pattern
  claim: 雷曼兄弟 2008 年从 60 美元跌至不到 1 美元、30 美元时大量"过度恐慌"判断者买入后归零，是"价格正确反映恶化基本面"的典型案例，可用于校准"过度反应 vs 合理反应"的判断边界。
  mechanism: >
    表面特征（短期内大幅下跌、市场情绪恐慌）与过度反应案例相似；
    但下跌有真实基本面支撑（公司确实即将破产）；
    买入者用"恐慌"标签替代了基本面核查 → 归零。
  prerequisites:
    - 你正在评估一个看起来像"过度恐慌"的下跌机会
    - 你能拿到该资产的基本面信息
  invalid_conditions:
    - 下跌发生在你不了解基本面的资产上（无法区分）
    - 下跌发生在指数/ETF 整体层面（无单一基本面可查）
  signals:
    - "下跌催化剂是单一公司层面的事件（破产、欺诈、监管处罚）"
    - "公司有表外/复杂负债结构，难以独立估值"
    - "下跌速度极快、成交量极大（清算特征）但伴随基本面事件"
  counter_view: 即使是基本面恶化的标的，如果跌幅超过基本面恶化程度，仍可能有交易性机会（破产重组中的债券、特殊机会）——但这是另一门生意，不是本文说的过度反应套利。
  confidence: high
  empirical_support: 文章陈述雷曼从 60+ 美元跌到 < 1 美元的历史事实；30 美元买入者全部归零。
  source_refs: { article: 你赚的是谁的钱, location: "第一种钱 段中（行64-68）" }
  decision_use: 行为阀
  forbidden_inference: 不能推论"跌幅大且伴随基本面事件就一定不能买"——关键是基本面恶化程度与价格下跌幅度的相对关系，需要独立估值；也不能反向推论"基本面没恶化就一定能买"。
  draft_state: candidate

- unit_id: money-source-014
  type: case_pattern
  claim: 2020 年 3 月新冠崩盘是"时间框架错配"赚钱的清晰案例——优质公司几周内跌 30%-50%，卖出方多因 margin call/赎回/风控被迫抛售，无杠杆长时间框架方在随后 1-2 年获显著回报。
  mechanism: >
    短期约束方（杠杆、赎回、风控止损）被迫在不考虑长期价值时抛售；
    长时间框架方（现金充裕、无杠杆、不交代季度业绩）低位买入；
    市场恢复正常后，优质公司股价回归反映其持续经营价值。
  prerequisites:
    - 标的是优质公司（基本面未恶化，长期价值仍在）
    - 你处于无杠杆、现金充裕、无外部赎回压力的状态
    - 你能在恐慌中执行（结构性条件具备 + 心理上能承受浮亏）
  invalid_conditions:
    - 标的是基本面恶化的公司（即使时间框架错配，也难回归）
    - 你自己也有杠杆或短期资金压力（你成了被迫卖出方）
    - 危机是结构性的（如 2008 是金融系统本身出问题，不是单纯流动性事件）
  signals:
    - "下跌速度极快、成交量异常放大（流动性事件特征）"
    - "下跌广泛（系统性而非单一公司）"
    - "VIX 等恐慌指标达到历史极端百分位"
    - "你的资金状态：无杠杆、现金可用、无外部交代需求"
  counter_view: 2008 也是大幅下跌，但很多标的永远没回归（金融股、部分消费股），区别在于那次是基本面系统性恶化，不是单纯流动性事件——这正好说明了与雷曼案例的区分难度。
  confidence: high
  empirical_support: 文章陈述 2020 年 3 月优质公司几周内跌 30%-50%，无杠杆长时间框架方在 1-2 年内获显著回报（市场共识的历史事实）。
  source_refs: { article: 你赚的是谁的钱, location: "第四种钱 段中（行94-98）" }
  decision_use: H_L
  forbidden_inference: 不能推论"任何系统性下跌都是时间框架错配机会"——必须区分流动性冲击（2020）vs 基本面系统性恶化（2008）；也不能推论"我有长期视野就一定能利用"——还要无杠杆+现金+独立估值。
  draft_state: candidate

- unit_id: money-source-015
  type: signal
  claim: 一笔交易如果三个空（触发条件/对手方群体/对手方非最优原因）任一填不上，就是"不知道自己在赚谁的钱"的明确信号，应停止出手。
  mechanism: >
    三空完整 = 你能定位收益来源（哪种钱、谁的错、为什么错）；
    缺任一 = 收益来源混淆 = 即使这次赚了也不知道为什么 = 长期会以不知道为什么亏的方式还回去。
  prerequisites:
    - 你愿意在每笔交易前做这次自问
    - 你对市场参与者生态有基本了解（散户/指数/保险/公募/HFT/对冲）
  invalid_conditions:
    - 被动指数投资/定投（不需要回答）
    - 真正的长期价值投资（赚企业价值，非对手方错误）
  signals:
    - "你只能说出策略名（如'趋势跟踪'）但说不出对手方"
    - "你说得出对手方但说不出他为什么非最优"
    - "你说得出原因但说不出触发条件"
  counter_view: 某些做市/套利类策略的对手方画像较模糊但仍可盈利。
  confidence: medium
  empirical_support: 文章作为方法论启发，未给实证回测。
  source_refs: { article: 你赚的是谁的钱, location: "一个诊断性的问题 段（行104-110）" }
  decision_use: 行为阀
  forbidden_inference: 不能推论"三空都填上 = 一定能赚"——这是必要不充分条件。
  draft_state: candidate

- unit_id: money-source-016
  type: principle
  claim: 长期持有优质资产是正和博弈，赚的是企业经营创造的增量价值，不是对手方的钱；这是与本文四种钱（主动交易零和）并列的另一类生意。
  mechanism: >
    优质企业持续产生利润 → 留存收益再投资或分红 → 内在价值持续增长 → 股价长期上涨反映价值创造；
    所有持有者作为整体都赚，不存在零和的对手方亏损。
  prerequisites:
    - 标的确实是优质企业（持续 ROIC > WACC、有护城河、有增长或稳定复利能力）
    - 持有期足够长，让企业价值创造在价格上得到反映
    - 买入估值合理（避免估值消化侵蚀企业价值增长）
  invalid_conditions:
    - 标的并非优质企业（伪装成"长期持有"的题材股/价值陷阱）
    - 持有期被中途打断（个人现金流压力、心态崩塌）
    - 买入估值过高（即使企业优质，多年收益被消化）
  signals:
    - "ROIC 持续 > WACC"
    - "自由现金流可持续且再投资回报率可观"
    - "护城河可识别（品牌/网络/规模/转换成本）"
  counter_view: 即使是优质企业，市场价格也可能长期高估其价值，导致持有期收益不及预期（70 年代 Nifty Fifty、2000 年互联网泡沫）。
  confidence: high
  empirical_support: 文章作为公理陈述（与零和交易对比），未给具体回测。
  source_refs: { article: 你赚的是谁的钱, location: "零和、负和与正和 段（行32-34）" }
  decision_use: 收益来源识别
  forbidden_inference: 不能推论"长期持有就一定赚"——必须标的优质+估值合理+持有期不被打断；也不能把伪装的题材股/价值陷阱当成"长期持有优质资产"。
  draft_state: candidate

- unit_id: money-source-017
  type: anti_pattern
  claim: 把"我有耐心/我相信它会涨回来"的信念当成时间框架错配策略的依据是脆弱的——信念在浮亏面前会崩塌，真正支撑长周期持有的是基于独立分析的可辩护估值判断。
  mechanism: >
    信念是心理属性，浮亏越大越脆弱；
    可辩护估值判断是分析属性，不随情绪波动；
    把信念当依据 → 浮亏到某点时崩溃卖出 → 实际时间框架被压缩 → 错失回归。
  prerequisites:
    - 你正在考虑用"长期视野"作为下跌加仓/持有的理由
    - 你的浮亏已开始影响情绪
  invalid_conditions:
    - 你已经有可辩护的独立估值判断（这时不需要靠信念）
  signals:
    - "你描述仓位的语言是'我相信'而不是'根据 X/Y/Z 估值，当前价格低于合理价值的 Z%'"
    - "你拒绝重估仓位逻辑，只重复'长期'"
    - "你在浮亏加深时不断给自己讲鼓励的话"
  counter_view: 某些顶级投资者（如 Buffett）确实描述过"信念"的重要性——但他们的信念建立在数十年基本面研究之上，本质是内化的估值判断，不是无根据的乐观。
  confidence: high
  empirical_support: 文章作为心理观察陈述，未给独立实证。
  source_refs: { article: 你赚的是谁的钱, location: "第四种钱 段末（行98）" }
  decision_use: 行为阀
  forbidden_inference: 不能推论"任何提及信念都是错的"——关键是信念是否有可辩护的分析基础；也不能推论"有估值判断就不会情绪崩溃"——估值判断降低崩溃概率但不消除。
  draft_state: candidate

