article_id: 商品超级周期
article_path: /Users/murphy/Documents/Obsidian Vault/Clippings/商品超级周期投资方法论.md
article_dominant_type: methodology_framework
article_one_line: >
  以内存式商品为原型，提炼出"供给破坏→库存拐点→价格权→利润凸性→盈利上修→叙事反身性→供给响应→风险释放→席位轮动"九段状态机；
  核心不是预测价格，而是识别利润池在产业链、时间和资产之间的迁移。

distilled_units:

  ###################################################################
  # 原理层（principle）
  ###################################################################

  - unit_id: cc-001
    type: principle
    claim: >
      商品价格由边际供给曲线形状决定，不由平均供需总量差决定。
    mechanism: >
      总量供需差通过价格机制出清的过程，依赖于供给曲线在当前产能利用率区间的斜率。
      产能利用率低时，闲置产能可以线性满足新增需求，价格弹性低；
      接近满产时，新增需求只能由高成本产能、加班外协、低良率设备、库存释放、新产能、需求竞价满足，
      供给曲线迅速变陡，单位需求增量对应的价格涨幅非线性放大。
    prerequisites:
      - 商品市场接近出清，产能利用率高
      - 供给曲线可被观测（产能利用率、闲置产能、高成本产能占比数据可得）
      - 短期新增产能受限（建设周期长、资本开支壁垒高）
    invalid_conditions:
      - 产能利用率低、闲置产能大
      - 供给曲线接近线性（如完全竞争可变成本行业）
      - 需求增长被替代品或规格降级吸收
      - 政策管制价格（如补贴、价格上限）
    signals:
      - 产能利用率持续高于阈值（85%+ 因行业而异）
      - 高成本边际产能重启
      - 交期延长、报价有效期缩短
      - 库存天数下降但绝对库存不再增
    counter_view: >
      需求增长本身可以驱动长期价格上涨（如结构性终端需求扩张），不必都靠边际供给陡峭化。
      但此反方仅适用于供给同步受限的场景；若无供给约束，需求增长会被扩产吸收。
    confidence: high
    empirical_support: >
      文章给出内存、铜、铀、航运、化工等品类共同结构描述，未提供具体样本数据；
      经济学边际定价原理有教科书支持；具体阈值参数文章未给出。
    source_refs:
      article: 商品超级周期投资方法论
      location: "§商品超级周期的第一性原理 §1（行 74-102）"
    decision_use: H_B
    forbidden_inference: >
      不能由"产能利用率高"直接推断上市公司利润弹性，必须接 cc-002（利润凸性）和 INDUSTRY_SUPPLY_DEMAND 的 G5 价格接受闸门。
    draft_state: candidate

  - unit_id: cc-002
    type: principle
    claim: >
      高固定成本行业中，商品价格上涨跨越现金成本与完全成本临界点后，价格增量大部分转化为利润，形成利润价格凸性。
    mechanism: >
      EBITDA = 销量 × (实现价格 - 单位现金成本) - 固定费用。
      当实现价格从低于成本升至高于成本，每单位价格增量扣除变动成本后几乎全部落入毛利，
      销量不变时毛利率非线性扩张。
      利润价格弹性 = 价格涨幅对应的利润涨幅倍数，常见 5-20 倍。
      弹性来源：固定成本被分摊、毛利率基数低、营业杠杆。
    prerequisites:
      - 行业固定成本占比高（资本密集、折旧大）
      - 公司实现价格能跟随市场价格上涨
      - 销量不被需求破坏或合同锁定稀释
      - 成本端不与实现价格同步上涨
    invalid_conditions:
      - 成本（原料、能源、运费、人工）与实现价格同步上涨，剪刀差被吃掉
      - 公司签了长协价锁死、价格敞口低
      - 政府管制终端售价
      - 销量因需求破坏下降，抵消单价上涨
      - 利润留在应收账款、存货减值或 CapEx 中，不进经营现金流
    signals:
      - 实现价格明显上涨，单位成本下降
      - 毛利率快速扩张（季度环比加速）
      - EPS 上修速度高于收入上修速度
      - 自由现金流增速高于净利润增速
    counter_view: >
      利润凸性反向也成立：价格下跌时利润回撤同样非线性放大。
      凸性越高，下行风险越大，不能只看上行。
    confidence: high
    empirical_support: >
      文章给出方向性公式与"10% 涨价 → 50%-200% 利润上涨"经验区间；
      未提供跨样本数据校准，倍数随行业固定成本结构变化。
    source_refs:
      article: 商品超级周期投资方法论
      location: "§商品超级周期的第一性原理 §2（行 105-127）"
    decision_use: H_B
    forbidden_inference: >
      不能由利润弹性高直接推断是好投资；利润弹性同样放大下行回撤，必须叠加 cc-007（顶部信号）和 H_R 赔率票评估。
    draft_state: candidate

  - unit_id: cc-003
    type: principle
    claim: >
      超级周期必须包含供给侧记忆——上一轮熊市的资本纪律是本轮价格弹性的前置条件。
    mechanism: >
      长期熊市导致：行业亏损 → 资本开支削减 → 企业破产退出 → 设备老化 → 人员流失 →
      监管限制累积 → 项目融资困难 → 股东要求回购分红而非扩产 → 供应商生态萎缩 → 新项目建设周期延长。
      这些"记忆"形成永久性供给约束：即使价格回升，扩产决策、融资、设备交付、人才重建、
      认证、监管批准需要数年才能完成，供给响应曲线整体右移，为本轮需求弹性留出窗口。
    prerequisites:
      - 行业经历长期亏损或周期低谷（多年）
      - 资本开支实质性削减（不只是 maintenance CapEx）
      - 退出产能是永久性的（矿山关闭、设备转用、牌照退出、上游生态消失）
      - 项目融资、监管、人才、设备生态需要长时间重建
    invalid_conditions:
      - 熊市时间短、亏损不深，仅是临时维护式减产
      - 退出产能是临时的，价格回升即可重启
      - 行业固定成本低、扩产周期短
      - 上游供应商生态完整，重启成本低
      - 监管或政策可在短期内放开新产能
    signals:
      - 行业 CapEx/sales 处多年低位
      - 主要公司退出产能公告
      - 上游设备订单、矿山勘探支出下降
      - 行业人才流入指标恶化
      - 项目许可排队时长增加
    counter_view: >
      部分超级周期由需求意外爆发（如政策驱动或技术革命）创造，即使没有供给创伤，
      也能因为供给响应慢于需求而出现多年短缺。
      但缺乏供给记忆时，扩产最终会到来，周期长度受限。
    confidence: medium
    empirical_support: >
      文章作为方法论提出，未给出系统样本验证；
      历史上内存（2015-2017）、航运（2008-2020）、铜（2015-2021）等案例支持方向，
      但"最惨熊市孕育最大牛市"作为强断言仍属经验观察，非严格样本。
    source_refs:
      article: 商品超级周期投资方法论
      location: "§商品超级周期的第一性原理 §3（行 130-148）"
    decision_use: H_B
    forbidden_inference: >
      不能由"上一轮熊市深"直接推断下一轮必为超级周期；
      必须叠加本轮真实终端需求是否存在（cc-015 需求质量）。
    draft_state: candidate

  ###################################################################
  # 机制层（mechanism）
  ###################################################################

  - unit_id: cc-004
    type: mechanism
    claim: >
      商品周期可被映射为 S0-S7 八阶段状态机，每阶段有可观测的供需/价格/盈利/股票特征，
      阶段迁移由库存方向、价格斜率、盈利上修斜率、供给响应、Attention 拥挤度驱动。
    mechanism: >
      S0 供给过剩崩溃 → S1 供给破坏与资本纪律 → S2 库存拐点 → S3 价格拐点与缺货初现 →
      S4 利润释放与盈利上修 → S5 稀缺反身性与叙事扩散 → S6 供给响应与需求破坏 → S7 价格反转与库存再累积。
      迁移驱动力：
      库存变化方向（S1→S2→S3）、价格斜率（S3→S4）、盈利上修斜率（S4→S5）、
      供给响应与需求破坏（S5→S6）、供需反转（S6→S7）。
      每阶段对应不同股票风险收益特征：S2-S3 是风险收益最优窗口，S5 是 Attention 反身性峰值，S6 是预期峰值。
    prerequisites:
      - 商品市场具备可观测的产能、库存、价格、合同价、订单、交付期数据
      - 上市公司财报和盈利预测可追踪
      - 渠道证据（经销商、客户、上下游）可获取
      - 资本市场和分析师行为可观测
    invalid_conditions:
      - 政策管制价格或补贴主导市场（如部分农产品、碳配额、政策型商品）
      - 市场结构分散、数据不可观测
      - 商品本身没有可识别的"产能建设周期"（纯金融资产、纯服务）
      - 周期被外部冲击（战争、疫情、政策突变）强行终止
    signals:
      - 库存变化方向由正转负（S1→S2 关键信号）
      - 现货价格止跌、报价有效期缩短（S2→S3）
      - 合同价跟随现货价上行（S3→S4）
      - EPS 上修速度加快（S4）
      - 客户重复下单、take-or-pay 增加（S4→S5）
      - 新产能宣布激增、客户寻找替代（S5→S6）
      - 现货价格先跌、重复订单取消（S6→S7）
    counter_view: >
      状态机假设周期存在可识别的有序阶段，实际中阶段可能并行、回退、跳跃，
      特别是政策型商品可能直接从 S0 跳到 S5 或从 S5 跳回 S0。
    confidence: medium
    empirical_support: >
      文章作为方法论框架提出，未提供统计样本验证；
      内存、航运等少数案例提供了模式印证。
    source_refs:
      article: 商品超级周期投资方法论
      location: "§商品周期七阶段状态机（行 150-343）"
    decision_use: H_B
    forbidden_inference: >
      不能由"当前处于 S2 或 S3"直接推断应建仓；
      阶段识别是输入，最终动作必须通过四票（H_B/H_R/H_L/H_C）独立判断。
      阶段判断本身有概率，不能写成确定值。
    draft_state: candidate

  - unit_id: cc-005
    type: mechanism
    claim: >
      商品投资必须同时观察四个时钟——物理供给时钟、库存与价格时钟、盈利时钟、股票与 Attention 时钟——
      它们速度递增，股票领先商品、商品领先财报、财报领先共识完成。
    mechanism: >
      物理供给时钟最慢：建矿、建厂、设备、许可、认证、良率爬坡、电网接入，以年计。
      库存与价格时钟较快：需求边际改善 → 库存下降 → 现货上涨 → 合同价调整，以季计。
      盈利时钟更慢一拍：合同重定价、成本结转、产品结构调整、季度确认，财报滞后价格 1-2 季度。
      股票与 Attention 时钟最快：提前 6-12 个月交易，在利润最差时见底、利润最好时见顶。
      时钟不同步导致：股票已交易未来供需二阶导，而财报与共识仍停留在过去；
      交易的不是当前利润，而是未来供需状态变化的一阶导和二阶导。
    prerequisites:
      - 四个时钟的数据都可观测或可代理
      - 资本市场具有一定前瞻性（机构投资者、卖方分析师）
      - 行业具有明显的物理供给滞后
    invalid_conditions:
      - 政策驱动的非市场定价商品（如碳配额，价格由政策决定而非供需）
      - 市场规模过小、流动性低，股票与商品脱钩
      - 财报质量低、信息披露滞后严重
      - 政策突变切断股票-商品-财报传导链
    signals:
      - 股价已启动但财报尚未反映（领先-滞后差扩大）
      - 现货价格上涨但合同价未调整（合同时钟）
      - 库存下降伴随股价启动（库存时钟领先财报）
      - ETF/期权/杠杆资金拥挤（Attention 时钟加速）
    counter_view: >
      时钟领先关系是统计意义上的，单次周期可能因外部冲击（政策、战争、流动性危机）而失效。
      特别是流动性危机时，股票可能同步甚至滞后商品。
    confidence: medium
    empirical_support: >
      文章作为方法论提出；
      "股票领先商品、商品领先财报"是经验观察，跨样本统计在金融文献中存在但强度因市场而异。
    source_refs:
      article: 商品超级周期投资方法论
      location: "§商品投资必须同时看四个时钟（行 345-381）"
    decision_use: H_L
    forbidden_inference: >
      时钟领先关系是 H_L 周期票（软探测器），不能直接更新 H_B 经营票。
      不能由"股票已启动"直接推断经营胜率提高；只能作为时间窗口和赔率的参考。
    draft_state: candidate

  - unit_id: cc-006
    type: mechanism
    claim: >
      涨价周期识别应建立六层证据栈——媒体→渠道→行业→合同→财报→资本配置——
      证据从第一层向第五、六层迁移时，涨价由交易题材升级为可持续利润周期。
    mechanism: >
      弱证据（媒体报道、单家涨价函、局部缺货）易被操纵和试探；
      渠道证据（多家经销商同步、报价有效期缩短、客户重复询价）反映供需结构变化；
      行业证据（多家公司同步涨价、上下游库存下降、高成本产能重启、跨地区同步）说明行业级供需收紧；
      合同证据（长协上调、合同周期缩短、take-or-pay、预付款）说明客户用合同锁定供给，可持续性强；
      财报证据（实现价上升、毛利率扩张、现金流改善、管理层展望上调）说明利润已确认；
      资本配置证据（客户用资本/预付款锁定供给、企业有纪律的 CapEx）说明供需格局可延续多年。
      证据在层间迁移的方向，决定了涨价是题材还是周期。
    prerequisites:
      - 六层证据源都可观测
      - 能够区分订单/合同/财报/资本配置不同层级的信号
      - 涨价函与实现价格、合同价、现货价可分离追踪
    invalid_conditions:
      - 只有第一层媒体信号，其他层未出现（题材阶段）
      - 行业集中度极低，单家涨价不可代表行业
      - 涨价被政府价格管制干预
      - 客户可通过自建或替代品绕开（合同证据不可持续）
    signals:
      - 涨价函数量增加（L1→L2）
      - 经销商报价同步上调（L2）
      - 多家公司同步涨价、上下游库存下降（L2→L3）
      - 长协价上调、合同周期缩短、take-or-pay（L3→L4）
      - 财报毛利率扩张、现金流改善（L4→L5）
      - 客户用预付款锁定供给（L5→L6）
    counter_view: >
      某些超级周期始于政策突变，第一层证据未充分展开时合同与资本配置直接出现（如碳配额）。
      严格按六层顺序迁移可能错过政策型机会。
    confidence: medium
    empirical_support: >
      文章作为方法论框架提出；
      与 INDUSTRY_SUPPLY_DEMAND 六道闸门（G1-G6）逻辑一致，文章未给统计样本。
    source_refs:
      article: 商品超级周期投资方法论
      location: "§如何识别真正的涨价周期（行 383-431）"
    decision_use: H_B
    forbidden_inference: >
      不能由"L3-L4 证据出现"直接推断买入；
      必须叠加估值（H_R）、仓位（H_C）、行为阀（BEHAVIOR_REVIEW）独立判断。
    draft_state: candidate

  ###################################################################
  # 启发式（heuristic）
  ###################################################################

  - unit_id: cc-007
    type: heuristic
    claim: >
      商品股票顶部信号七件套——价格涨但涨幅放缓、盈利上修幅度下降、扩产项目密集落地、
      客户承受不起、Good-News-Down、龙头转弱二线补涨、低 PE 陷阱。
    mechanism: >
      商品股票顶部通常领先价格、财报、共识。
      顶部形成机制：市场从交易当前利润切换到交易未来供需二阶导。
      当未来供给增加（新产能宣布、设备进场、良率提升、销售认证完成）和需求承受能力下降
      （客户降级、推迟采购、寻找替代、政策干预）同时出现，市场开始降低未来供需缺口的预期，
      即使当前价格仍涨、盈利仍上修、新闻仍利多，股票已开始 Good-News-Down（利好不涨）。
      低 PE 陷阱：峰值盈利使 PE 分母处于高位，看似便宜，但分母即将下修。
    prerequisites:
      - 已经历完整的 S3-S5 阶段（价格上涨、利润释放、叙事扩散）
      - 可观测到新产能宣布和落地节奏
      - 客户端成本结构可追踪
      - 资本市场已对叙事充分定价（ETF/杠杆资金拥挤）
    invalid_conditions:
      - 周期被需求二次加速延长（如新一轮政策刺激、终端需求结构性扩张）
      - 供给侧出现永久性退出（如矿山枯竭、政策性禁采），扩产永不兑现
      - 市场整体流动性宽松，Good-News-Down 被资金面盖过
    signals:
      - 价格仍涨但涨幅连续缩小
      - EPS 上修幅度连续缩小
      - 新产能项目投产节奏进入关键节点（设备进场、良率爬坡）
      - 客户公开表示成本压力、寻找替代
      - 利好新闻不推动股价（Good-News-Down）
      - 龙头股停止创新高、二线高 beta 补涨
      - 利润处于历史峰值、PE 处于历史低位
    counter_view: >
      主升浪可能多次延伸，单次"利好不涨"可能是消化期而非顶部；
      需要多信号同时出现才能确认顶部。
      部分超级周期可由结构性短缺（如铜矿品位下降、铀矿短缺）持续多年，
      "低 PE = 顶部"信号在结构性短缺中可能失效。
    confidence: medium
    empirical_support: >
      文章作为经验观察提出，未提供系统样本统计；
      历史上航运（2008）、锂（2022）、内存（2017-2018）等案例提供模式印证。
    source_refs:
      article: 商品超级周期投资方法论
      location: "§商品股票的退出（行 557-589）"
    decision_use: H_L
    forbidden_inference: >
      七信号出现是 H_L 周期票和 H_R 赔率票的减仓/降级触发，不能直接授权清仓；
      必须叠加 H_B 经营票是否恶化（财报、现金流）独立判断。
    draft_state: candidate

  - unit_id: cc-008
    type: heuristic
    claim: >
      最优买点有四种——供给破坏买点（S1）、库存与现货拐点买点（S2-S3）、
      盈利上修主升浪买点（S4）、Attention 去杠杆后二次进入买点（S5 后回撤）——
      分别对应不同风险收益特征。
    mechanism: >
      供给破坏买点：行业仍亏损、市场极度悲观、产能已退出、股票不再创新低；
      赔率最高、时间不确定；适合低成本龙头。
      库存与现货拐点买点：库存开始下降、现货价格止跌、交期不再缩短、渠道补库启动；
      风险收益最优的确认买点。
      盈利上修主升浪：毛利率扩张、EPS 上修、现金流改善、远期价格假设上调；
      确定性高但估值已不再极低。
      Attention 去杠杆后二次进入：基本面未坏、股票快速回撤、ETF 与杠杆资金完成出清、
      隐含波动率回落、龙头重新走强、好消息重新推动股价；
      不是抄底，而是 Fundamental Still Strong × Flow Damage Repaired。
    prerequisites:
      - 能够识别当前所处周期阶段（cc-004）
      - 不同买点对应不同公司类型：低成本龙头、瓶颈纯度、利润弹性、二次进入
      - 估值、流动性、波动率指标可观测
    invalid_conditions:
      - 阶段识别错误（如误将 S6 当成 S2 二次进入）
      - 基本面已坏却当成 Flow Damage（误判）
      - 估值已严重透支却当成盈利上修主升浪
      - 低成本龙头本身基本面恶化（成本优势丧失）
    signals:
      - 产能退出公告 + 股价止跌（买点 1）
      - 库存天数下降 + 现货价格止跌 + 交期延长（买点 2）
      - 毛利率扩张 + EPS 上修加速（买点 3）
      - ETF 资金流出 + 隐含波动率回落 + 龙头重新走强（买点 4）
    counter_view: >
      四买点框架是状态化的简化，实际中可能没有清晰的"S2-S3 窗口"，
      政策型或需求突涨型周期可能直接跳过买点 1 和 2，进入买点 3。
      二次进入买点的"基本面未坏"判断本身有概率，可能误判。
    confidence: medium
    empirical_support: >
      文章作为方法论框架提出；
      与 INDUSTRY_SUPPLY_DEMAND G3-G5 闸门有结构对应，未提供统计样本。
    source_refs:
      article: 商品超级周期投资方法论
      location: "§最优买点不是一个，而是四种（行 521-555）"
    decision_use: H_R
    forbidden_inference: >
      买点识别是 H_R 赔率票输入，不能直接授权仓位；
      必须叠加 H_B（公司能否留利润）、H_C（最大损失定义）、BEHAVIOR_REVIEW（不在情绪期加仓）。
    draft_state: candidate

  ###################################################################
  # 信号（signal）
  ###################################################################

  - unit_id: cc-009
    type: signal
    claim: >
      库存变化方向由正转负，是商品周期底部最重要的信号——比库存绝对水平更重要。
    mechanism: >
      库存水平高时，市场焦点是去库存速度；
      当库存绝对值仍高但增量由正转负（库存天数下降、订单取消减少、交期停止缩短、现货不再创新低），
      说明供需平衡正在修复，价格拐点临近。
      方向（一阶导）比水平更早反映拐点；水平低未必是底（可能在累库前的临时低位），
      方向由正转负则确认供需结构改变。
    prerequisites:
      - 库存数据可观测（绝对值、天数、渠道库存、上下游库存）
      - 能区分库存变化的需求驱动 vs 供给驱动
      - 渠道订单、交期数据可追踪
    invalid_conditions:
      - 库存下降是恐慌性前置采购驱动，终端需求未改善
      - 库存下降是贸易商投机性出货，非真实消耗
      - 政策扰动使库存数据失真（如战略储备释放、出口禁令前囤货）
      - 数据口径变化或统计质量差
    signals:
      - 库存天数环比连续下降
      - 渠道订单取消减少
      - 交期停止缩短并开始延长
      - 现货价格止跌不再创新低
    counter_view: >
      库存方向反转在某些情况下是虚假信号——如终端需求继续恶化但贸易商短期出清库存，
      方向反转后库存再次累积。需要叠加终端需求数据确认。
    confidence: medium
    empirical_support: >
      文章作为方法论提出；
      与 INDUSTRY_SUPPLY_DEMAND G3 闸门一致；未提供统计样本。
    source_refs:
      article: 商品超级周期投资方法论
      location: "§S2：库存拐点（行 213-231）；公理四（行 720）"
    decision_use: H_B
    forbidden_inference: >
      库存方向反转是必要条件非充分条件；
      不能直接推断应建仓，必须叠加 cc-006 证据栈更高层级和需求质量（cc-015）。
    draft_state: candidate

  - unit_id: cc-010
    type: signal
    claim: >
      Good-News-Down（涨价不涨、财报超预期不涨、上调指引不涨、长协落地不涨、缺货新闻不涨）
      是商品股票顶部的高优先级信号。
    mechanism: >
      商品股票的定价核心是未来供需状态的一阶导和二阶导。
      当利好新闻连续出现但股价不涨甚至下跌，说明市场已对利好充分定价，
      且市场开始交易未来供需恶化（供给响应、需求破坏）。
      Good-News-Down 反映共识完成且边际买家衰竭，是顶部领先财报、价格的最早股票信号。
    prerequisites:
      - 已经历完整的 S3-S5 阶段，股价已大幅上涨
      - 利好新闻持续出现（涨价函、财报超预期、长协落地）
      - 市场流动性、ETF 拥挤度可观测
    invalid_conditions:
      - 大盘整体调整导致商品股与市场同步下跌（非行业特定信号）
      - 流动性危机或风险事件导致避险
      - 公司特定利空（管理层、诉讼、监管）盖过行业利好
      - 消化期内正常震荡，非趋势性 Good-News-Down
    signals:
      - 涨价函公布当日股价不涨或下跌
      - 财报超预期后股价回落
      - 长协落地、缺货新闻无股价反应
      - 龙头股相对指数走弱
    counter_view: >
      单次 Good-News-Down 可能是消化期，非顶部；
      必须是连续多次、跨多种利好类型的反应迟钝，才能确认。
      超级周期中也可能有中期消化，消化后继续上涨。
    confidence: medium
    empirical_support: >
      文章作为经验观察提出；
      与 cc-007 顶部信号体系一致；未提供统计样本。
    source_refs:
      article: 商品超级周期投资方法论
      location: "§S5 反身性（行 304）；§退出顶部信号（行 573-576）"
    decision_use: H_L
    forbidden_inference: >
      Good-News-Down 是 H_L 周期票信号，不能直接触发清仓；
      必须叠加 H_B 经营票恶化（财报、毛利率）和 H_R 赔率票评估。
    draft_state: candidate

  - unit_id: cc-011
    type: signal
    claim: >
      永久性供给破坏 vs 临时性供给收缩的判别——前者创造超级周期，后者只能带来短暂反弹。
    mechanism: >
      永久性供给破坏：产线关闭、设备转作他用、矿山关闭、船舶拆解、牌照退出、上游供应链消失、
      CapEx 长期不足。这些退出不可逆，价格回升后产能无法快速重启。
      临时性供给收缩：临时维护、库存出清、价格战中降价减产、政策性限产。
      这些退出可逆，价格回升即可重启产能，无法创造多年短缺。
      判别决定周期是超级周期还是普通反弹。
    prerequisites:
      - 可观测退出产能的类型（设备状态、矿山寿命、牌照状态、上游生态）
      - 行业资本开支多年趋势可追溯
      - 退出公告细节可追踪（"永久关停" vs "临时维护"）
    invalid_conditions:
      - 行业数据透明度低，无法区分永久 vs 临时
      - 临时性收缩被宣传为永久（管理层夸大）
      - 政策性限产可能随时放开
      - 技术替代使永久性退出失去意义（如某材料被新工艺取代）
    signals:
      - 设备拆除、矿山闭坑、船舶拆解公告
      - 上游供应商倒闭或转行
      - 行业人才大量流出
      - CapEx/sales 多年低位、勘探支出多年低位
    counter_view: >
      "永久性"是相对的——技术进步、政策变化、价格大幅上涨可能使原本被认为永久的退出产能重新激活
      （如低品位矿重新开采、老旧油田重启）。
    confidence: medium
    empirical_support: >
      文章作为方法论提出；
      与 STRUCTURAL_CHANGE_BOTTLENECK 供给反噬时钟一致；未提供统计样本。
    source_refs:
      article: 商品超级周期投资方法论
      location: "§S1 供给破坏（行 178-211）"
    decision_use: H_B
    forbidden_inference: >
      不能由"出现永久性退出公告"直接推断超级周期成立；
      必须叠加本轮真实终端需求（cc-015）和需求质量判断。
    draft_state: candidate

  ###################################################################
  # 反模式（anti_pattern）
  ###################################################################

  - unit_id: cc-012
    type: anti_pattern
    claim: >
      用静态 PE 判断商品股便宜——峰值盈利制造低 PE 陷阱，最低 PE 通常出现在盈利峰值附近。
    mechanism: >
      商品股 PE = 价格 / 盈利。当盈利处于周期峰值时，分母处于高位，PE 计算值低，看似便宜。
      但峰值盈利不可持续，市场已开始交易未来盈利下修（cc-005 时钟领先），
      股价领先财报下跌，使 PE 进一步降低，形成"越跌越便宜"的错觉。
      实际是分母（盈利）即将下修，而非分子（股价）低估。
    prerequisites:
      - 商品股已经历完整周期上涨，盈利处于历史高位
      - PE 数据可得
      - 周期位置可判断（cc-004）
    invalid_conditions:
      - 结构性短缺型商品（如铀、铜矿枯竭），峰值盈利可持续多年
      - 公司业务多元化，商品业务占比低，PE 不反映单一商品周期
      - 商品价格已下跌、盈利已下修后的低 PE
    signals:
      - 利润处于历史峰值、PE 处于历史低位
      - 商品价格仍高但股价已开始下跌
      - 分析师远期价格假设已上调到长期高位
      - 公司宣布大额 CapEx、扩产计划
    counter_view: >
      并非所有低 PE 都是陷阱——结构性短缺、低成本龙头、业务转型的公司，
      低 PE 可能反映真实低估。需要区分周期型 vs 结构型。
    confidence: medium
    empirical_support: >
      文章作为经验观察提出；
      "PE 陷阱"是周期股投资文献的常见观点，但具体阈值和判别方法文章未给。
    source_refs:
      article: 商品超级周期投资方法论
      location: "§退出顶部信号 §7（行 581-588）；公理六（行 727）"
    decision_use: H_R
    forbidden_inference: >
      "PE 低 = 陷阱"是反模式警示，不能反向推断"PE 高 = 安全"；
      必须独立评估周期位置、盈利可持续性、公司业务结构。
    draft_state: candidate

  - unit_id: cc-013
    type: anti_pattern
    claim: >
      把补库存需求误判为终端需求——补库存结束后需求会突然下降，造成周期误判。
    mechanism: >
      商品总需求 = 真实终端需求 + 补库存需求 + 恐慌性前置采购 + 投机性库存。
      补库存需求：客户此前去库存后恢复正常采购，持续性中等，容易被误认为结构性增长。
      恐慌性前置采购：客户担心涨价或缺货，提前采购未来数季度需求，强化当前周期但透支未来。
      投机性库存：贸易商、金融资金因价格上涨囤货，最危险，可能反向释放。
      只看总量需求增长而忽视需求质量，会在补库存和前置采购透支后误判周期延续性。
      需求质量公式：Demand Quality = 真实终端需求 - 恐慌前置需求 - 投机性库存。
    prerequisites:
      - 能区分终端消耗与渠道/客户库存变化
      - 能追踪贸易商和金融资金库存
      - 客户订单和真实消耗数据可对照
    invalid_conditions:
      - 终端需求是真实结构性增长（如新能源、AI、电网）
      - 补库存仅是渠道恢复正常，不伴随投机性囤货
      - 市场结构透明，投机性库存占比小
    signals:
      - 总需求增长但终端产量/消耗未同步增长
      - 客户库存天数显著上升
      - 贸易商和金融资金库存增加
      - 客户重复下单、提前下单（恐慌前置）
    counter_view: >
      部分补库存需求是正常的供应链修复，不应全部视为低质量；
      但需要区分"正常补库" vs "投机性囤货"。
    confidence: medium
    empirical_support: >
      文章作为方法论提出；
      与 INDUSTRY_SUPPLY_DEMAND G1/G2 闸门、cc-006 证据栈一致；未提供统计样本。
    source_refs:
      article: 商品超级周期投资方法论
      location: "§商品需求必须拆成四种（行 433-457）"
    decision_use: H_B
    forbidden_inference: >
      需求质量评估是 H_B 经营票输入；
      不能由"需求质量低"直接推断股价下跌，需叠加估值、流动性、共识判断。
    draft_state: candidate

  - unit_id: cc-014
    type: anti_pattern
    claim: >
      在基本面最强时放弃风控——商品股最大回撤往往发生在利润仍创纪录的时候。
    mechanism: >
      商品股定价核心是未来供需状态二阶导。
      当基本面最强（利润创纪录、价格持续上涨、新闻利多）时，市场已对利好充分定价，
      边际买家衰竭，未来供给响应和需求破坏即将出现。
      此时风控放松（追高、加杠杆、扩大仓位）会使组合暴露于 Good-News-Down 和预期峰值反转，
      回撤幅度最大。
    prerequisites:
      - 商品股已处于 S5 或 S6 阶段
      - 利润处于历史峰值、市场共识高度一致
      - ETF、期权、杠杆资金已大量涌入
    invalid_conditions:
      - 结构性短缺型商品，基本面可持续多年
      - 终端需求二次加速（新一轮政策、技术革命）
      - 公司业务结构转型，单一商品周期影响减弱
    signals:
      - 利润创纪录、PE 处历史低位（cc-012）
      - ETF 资金大量涌入、隐含波动率上升
      - 分析师远期价格假设上调到长期高位
      - 资本开支激增、扩产项目密集落地
    counter_view: >
      超级周期中段的确可以持有甚至加仓，"基本面最强 = 放弃风控"是经验警示，
      不是机械规则。需要结合 cc-007 顶部信号七件套共同判断。
    confidence: medium
    empirical_support: >
      文章作为经验观察提出；
      历史上锂（2022）、稀土（2011-2012）、航运（2008）等案例提供印证。
    source_refs:
      article: 商品超级周期投资方法论
      location: "§十个常见错误 §10（行 675-677）；公理七（行 731）"
    decision_use: 行为阀
    forbidden_inference: >
      "基本面最强时放弃风控"是 BEHAVIOR_REVIEW 触发条件；
      不能反向推断"基本面弱时可以放弃风控"。任何时点都需独立评估 H_C 仓位票。
    draft_state: candidate

  ###################################################################
  # 案例模式（case_pattern）
  ###################################################################

  - unit_id: cc-015
    type: case_pattern
    claim: >
      "内存式商品"作为一类特殊制造型准商品——产品标准化、价格受供需决定、CapEx 巨大、
      固定成本高、产能建设周期长、产品存在技术升级、客户认证门槛、高低端不可完全替代、
      利润对价格高度敏感——共同结构是供给曲线某阶段陡峭，需求轻增即非线性涨价。
    mechanism: >
      内存、面板、硅料、部分化工品、高端电子材料等共同特征：
      产品相对标准化（可定价）+ CapEx 巨大 + 建设周期长（供给响应慢）+ 客户认证门槛
      （合格产能而非名义产能决定供给）+ 高低端不可替代（结构性短缺）。
      这些特征叠加，使供给曲线在利用率高时迅速变陡，单位需求增量对应的价格涨幅非线性放大，
      进而触发 cc-001（边际定价）→ cc-002（利润凸性）→ cc-004（状态机）的完整链条。
    prerequisites:
      - 商品具备制造型准商品结构特征（高 CapEx、长建设周期、认证门槛）
      - 高低端产品不可完全替代
      - 名义产能与合格产能存在差异
    invalid_conditions:
      - 纯金融资产或服务（不具物理产能概念）
      - 完全竞争可变成本行业（供给曲线线性）
      - 政策型商品（价格由配额决定而非供需）
      - 商品本身被技术替代（如某种材料被新工艺取代）
    signals:
      - 高端产品价格上涨快于低端
      - 客户认证周期延长
      - 名义产能利用率低但合格产能利用率高
      - 高低端产品价差扩大
    counter_view: >
      不同制造型准商品的周期长度、价格弹性、可贸易性、可存储性差异大；
      "内存式商品"是抽象共性，不能直接套用每个具体品类。
    confidence: medium
    empirical_support: >
      文章以内存为原型，提出可外推至铜、铀、航运、化工、能源、电子材料、工业品；
      跨品类共性为定性描述，未提供跨样本统计。
    source_refs:
      article: 商品超级周期投资方法论
      location: "§什么是"内存式商品"（行 47-68）"
    decision_use: H_B
    forbidden_inference: >
      "内存式商品"作为抽象共性不能直接外推至具体品类；
      每个具体品类需独立验证 cc-001、cc-002、cc-003 三原理是否成立。
    draft_state: candidate

  - unit_id: cc-016
    type: case_pattern
    claim: >
      五类商品修正项——天然资源型（铜/铀/油/锂）、制造型（内存/面板/硅料）、运力型（航运/油轮/航空）、
      认证型（高端电子材料/特种化学品/先进封装）、政策型（制冷剂/碳配额/部分能源农业品）——
      各自关注不同的供给约束来源。
    mechanism: >
      天然资源型：供给约束来自矿山品位、资源国政策、许可周期、成本曲线、地缘风险、副产品经济性。
      制造型：约束来自产能利用率、良率、产品代际迁移、设备交付、客户认证、折旧、停产可逆性。
      运力型：约束来自运力利用率、船舶/飞机交付表、空驶绕行、港口拥堵、拆船、租约期限；
      "库存"是可用运力而非仓库库存。
      认证型：约束来自客户认证时间、切换成本、一供二供结构、规格升级、良率、供应商集中度；
      即使名义产能充足，"合格产能"也可能不足。
      政策型：约束来自配额、环保、出口限制、补贴、战略储备、价格管制；
      政策既可创造超级周期，也可突然终结利润池。
    prerequisites:
      - 商品类型可被正确分类
      - 各类型对应的关键约束变量可观测
      - 商品市场结构清晰，单一类型主导
    invalid_conditions:
      - 商品类型混合（如锂既是资源型又有政策属性）
      - 商品类型随时间变化（如某种商品从制造型转向政策型）
      - 商品本身被技术替代
    signals:
      - 各类型对应的关键变量（品位、利用率、运力、认证周期、配额）出现方向性变化
    counter_view: >
      五类划分是简化，实际商品可能同时具备多种属性（如锂兼具资源型和政策型）；
      具体分析需综合考虑，不能机械套用单一类型框架。
    confidence: low
    empirical_support: >
      文章作为分类框架提出；
      各类型的具体阈值、案例、样本数据未提供。
    source_refs:
      article: 商品超级周期投资方法论
      location: "§不同商品必须使用不同修正项（行 591-636）"
    decision_use: H_B
    forbidden_inference: >
      商品分类只是分析起点；
      具体品类需独立验证各约束变量的实际作用，不能由分类直接推断周期。
    draft_state: candidate

  - unit_id: cc-017
    type: case_pattern
    claim: >
      Seat 选择模型——商品投资不是选公司，而是选利润接收席位：最低成本生产商、
      供给瓶颈纯度最高、利润价格弹性最高、First Cash Receiver、瓶颈设备与扩产收费站、
      被忽视的混合型公司——六类 Seat 各自对应不同周期阶段和风险收益特征。
    mechanism: >
      Seat 1 最低成本生产商：熊市能活、牛市利润最大、可逆周期扩产并购；适合早周期和穿越周期。
      Seat 2 供给瓶颈纯度最高：高端产品、稀缺矿种、独特认证、独家产能；超级周期核心 Seat。
      Seat 3 利润价格弹性最高：产量稳定、成本固定、现货敞口高；主升浪最强 beta，回撤最大。
      Seat 4 First Cash Receiver：利润可能流向矿权、运输、加工、设备、分销、能源、认证瓶颈方，
      非生产商；需回答谁先收到现金、谁有议价权。
      Seat 5 瓶颈设备与扩产收费站：商品价格上涨刺激扩产时，利润池从商品生产商迁移到设备、
      工程、材料、测试、物流、维护服务；商品 Seat → 扩产 Seat 迁移。
      Seat 6 被忽视的混合型公司：商品业务占比不高但利润弹性大，市场尚未重新估值；
      分部信息不透明、旧业务掩盖新利润池，是认知差机会。
    prerequisites:
      - 能识别利润池在产业链中的实际归属
      - 能区分商品 Seat 和扩产 Seat 的迁移时点
      - 能解析混合型公司的分部信息
    invalid_conditions:
      - 利润池归属判断错误（如误将设备商当 First Cash Receiver）
      - 商品本身没有瓶颈迁移（如纯标准化大宗品）
      - 混合型公司的商品业务实际占比和利润弹性被夸大
    signals:
      - Seat 1：成本曲线最低端、行业低谷仍产生正现金流
      - Seat 2：高端产品 ASP 涨幅远超行业平均
      - Seat 3：现货敞口高、毛利率快速扩张
      - Seat 4：上下游议价权向特定环节集中
      - Seat 5：商品生产商 CapEx 激增、设备订单暴涨
      - Seat 6：分部信息显示商品业务利润占比远高于收入占比
    counter_view: >
      Seat 分类是事后归纳，实际中可能没有清晰归属；
      一家公司可能同时具备多个 Seat 属性，需具体分析而非标签化。
      Seat 6 混合型公司"认知差"判断本身有概率，可能误判。
    confidence: medium
    empirical_support: >
      文章作为方法论框架提出；
      与 STRUCTURAL_CHANGE_BOTTLENECK 七步瓶颈测试中"控制权"和"定价权"对应；
      未提供跨样本统计。
    source_refs:
      article: 商品超级周期投资方法论
      location: "§标的选择：不是买"商品公司"，而是选择利润接收席位（行 459-509）"
    decision_use: H_B
    forbidden_inference: >
      Seat 选择是 H_B 经营票输入；
      不能由 Seat 类型直接推断买入，必须叠加估值（H_R）、周期阶段（H_L）、仓位（H_C）、
      行为阀独立判断。
    draft_state: candidate

  - unit_id: cc-018
    type: case_pattern
    claim: >
      产业景气概率与股票上涨概率必须分开——可能出现 P(产业超级周期持续)=80% 但
      P(股票未来六个月正收益)=45%，差异来自估值、拥挤、资金流、预期过高、Attention 去杠杆。
    mechanism: >
      产业景气反映供需缺口和利润释放；
      股票收益 = 产业景气 × 估值变化 × 资金流 × 共识预期 × Attention 周期。
      当产业仍强但估值已透支、ETF/期权/杠杆资金拥挤、市场共识高度一致、
      Attention 已完成去杠杆时，产业景气无法继续推动股票上涨。
      两个概率必须独立建立，不能由产业景气直接外推股票收益。
    prerequisites:
      - 能分别评估产业景气（供需、价格、利润）和股票定价（估值、共识、资金流）
      - 能识别 Attention 周期阶段
      - 估值方法合理（不依赖伪概率）
    invalid_conditions:
      - 估值未透支、资金未拥挤（两概率通常同步）
      - 流动性宽松盖过 Attention 拥挤
      - 公司业务结构使股票与商品脱钩
    signals:
      - 产业利润持续扩张但股价走平或下跌
      - 估值倍数处于历史高位
      - ETF 资金流入放缓、隐含波动率高企
      - 分析师远期价格假设已上调到长期高位
    counter_view: >
      长期看，产业景气与股票收益趋向同步；
      短期脱节可能由市场无效定价，但通常会修复。
      "概率脱节"是经验观察，非机械规则。
    confidence: medium
    empirical_support: >
      文章作为方法论提出；
      "产业强但股票不涨"案例（锂 2022H2、稀土 2012、航运 2008）提供模式印证；
      具体阈值和概率未提供。
    source_refs:
      article: 商品超级周期投资方法论
      location: "§贝叶斯更新（行 680-701）"
    decision_use: H_L
    forbidden_inference: >
      两概率分离是 H_L 周期票和 H_R 赔率票的输入；
      不能由"P(股票上涨)=45%"直接推断减仓，需结合 H_B 经营票独立判断。
      未校准的概率只能写 uncalled，不能写成具体数值（INDUSTRY_SUPPLY_DEMAND 边界）。
    draft_state: candidate

  - unit_id: cc-019
    type: case_pattern
    claim: >
      商品股票评分公式——StockAttractiveness = ScarcityCapture × MarginConvexity ×
      EstimateRevision × NarrativeGap − CrowdingRisk − SupplyResponse——
      六个维度乘积减拥挤与供给响应的扣减。
    mechanism: >
      ScarcityCapture（稀缺捕获）：公司能否接收利润池（cc-017 Seat 选择）。
      MarginConvexity（利润凸性）：价格弹性（cc-002）。
      EstimateRevision（盈利上修）：当前上修斜率（cc-004 S4）。
      NarrativeGap（叙事差距）：市场共识与基本面的差距（认知差）。
      CrowdingRisk（拥挤风险）：ETF/杠杆/期权资金拥挤度（cc-014）。
      SupplyResponse（供给响应）：新产能宣布、扩产落地节奏（cc-007）。
      前四项相乘（任一项极低则总分低），后两项相减（任一项高则总分降）。
    prerequisites:
      - 六个维度可独立评估
      - 不依赖伪概率或主观加权
      - 各维度数据可得
    invalid_conditions:
      - 任一关键维度数据缺失（应写 unknown 而非强行填值）
      - 加权方法未校准（应作为研究过滤器，非交易授权）
      - 公司业务结构使维度不可独立评估（如混合型公司）
    signals:
      - 前四项得分高、后两项得分低 → 高吸引力
      - 任一项极低 → 总分低（乘积关系）
    counter_view: >
      评分公式是启发式，权重和方法未严格校准；
      不同周期阶段、不同商品类型，各维度相对重要性可能变化。
      作为研究过滤器，非交易决策工具。
    confidence: low
    empirical_support: >
      文章作为方法论框架提出，未提供权重校准和统计样本；
      与 STRUCTURAL_CHANGE_BOTTLENECK 三年三倍反推过滤器和候选分类边界一致。
    source_refs:
      article: 商品超级周期投资方法论
      location: "§商品股票评分模型（行 511-519）"
    decision_use: H_R
    forbidden_inference: >
      评分公式是 H_R 赔率票研究过滤器，非交易授权；
      不能由"评分高"直接推断建仓，必须叠加 H_B（经营）、H_L（周期）、H_C（仓位）独立判断。
    draft_state: candidate

  - unit_id: cc-020
    type: case_pattern
    claim: >
      贝叶斯更新顺序——P(Supercycle) 先验，按有效供给永久退出 > 库存趋势反转 > 实现价格上涨 >
      毛利率与现金流确认 > 长协与预付款 > 新增产能兑现时间 > 客户需求质量 > 股票价格反应的
      权重排序更新后验。
    mechanism: >
      不同证据对超级周期假设的更新权重不同：
      有效供给永久退出（最强，结构性）→ 库存趋势反转（方向性）→ 实现价格上涨（确认）→
      毛利率与现金流确认（财务穿透）→ 长协与预付款（可持续性）→ 新增产能兑现时间（反证）→
      客户需求质量（需求侧质量）→ 股票价格反应（最弱，受流动性和 Attention 影响）。
      权重排序帮助在证据不完整时判断当前后验水平。
    prerequisites:
      - 各类证据源可观测
      - 能区分证据的独立性和根来源（同根信息只计一次）
      - 未固定参考类时写 uncalled（INDUSTRY_SUPPLY_DEMAND 边界）
    invalid_conditions:
      - 证据同根（多个媒体重复同一信息源）被错误计为多重独立证据
      - 概率数值未校准（应写 uncalled 而非具体百分比）
      - 证据类型被错误归类（如把涨价函当成"实现价格上涨"）
    signals:
      - 按权重排序累积证据
      - 高权重证据出现时后验显著提升
      - 低权重证据（如股价上涨）单独不显著提升后验
    counter_view: >
      权重排序是经验性的，不同商品类型、不同周期阶段权重可能变化；
      严格贝叶斯更新需要校准的参考类，文章未提供。
    confidence: low
    empirical_support: >
      文章作为方法论提出，权重为定性排序，未提供统计样本；
      与 INDUSTRY_SUPPLY_DEMAND 事件时钟和 uncalled 纪律一致。
    source_refs:
      article: 商品超级周期投资方法论
      location: "§贝叶斯更新（行 681-700）"
    decision_use: H_B
    forbidden_inference: >
      权重排序是 H_B 经营票研究输入；
      未校准的概率只能写 uncalled，不能写成具体数值；
      不能由"后验高"直接推断交易动作。
    draft_state: candidate

