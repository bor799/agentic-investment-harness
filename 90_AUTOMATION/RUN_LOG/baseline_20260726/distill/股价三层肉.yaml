- unit_id: stock-three-layer-012
  type: heuristic
  claim: 用"研报使用的估值法"反推市场真实定价逻辑时，要警惕机构包装——研报写 DCF 不代表市场真的在用 DCF，可能只是给市梦率定价披严肃外衣。
  mechanism: 推票机构需要维持"严肃金融分析师"标签 → 实际推票逻辑是市梦率/PEG → 调整 DCF 参数（折现率/永续增长率）让目标价落到市梦率水平 → 研报标称方法 ≠ 实际定价方法。
  prerequisites:
    - 看卖方研报时
    - 目标价对应的参数显著偏离常识
  invalid_conditions:
    - 部分机构/独立研究员如实披露估值法 → 反推无意义
  signals:
    - 目标价对折现率/永续增长率的敏感度异常
    - 推荐逻辑（叙事）与标称估值法（DCF）不一致
    - 多家机构目标价高度一致但参数各异（说明是先有目标价再调参数）
  counter_view: 不是所有研报都包装；蓝筹/成熟期公司的研报 DCF 更接近实际。
  confidence: medium
  empirical_support: 作者引温斯坦 / 茨威格 / 欧奈尔对"心口不一的赌狗"的鄙夷；截图中的大机构推市梦率资产却写 DCF
  source_refs: { article: 股价三层肉, location: 文末"满嘴仁义道德"段 }
  decision_use: 行为阀（防被研报标签误导）
  forbidden_inference: 不能从"研报写 DCF"直接推出"研报不可信"——需看参数
  draft_state: candidate

