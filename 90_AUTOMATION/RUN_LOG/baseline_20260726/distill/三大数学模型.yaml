    type: principle
    claim: 幂律世界的核心策略不是"每件事都做对"，而是"不在左尾毁灭 + 能识别右尾 + 右尾出现时给足合法仓位 + 右尾衰减时贝叶斯更新 + 不把曾经右尾当永恒资产"。
