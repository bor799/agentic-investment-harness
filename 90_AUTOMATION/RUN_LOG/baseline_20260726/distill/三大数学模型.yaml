  - unit_id: math-unified-001
    type: principle
    claim: 长期结果 = 更新能力 × 等待能力 × 右尾捕捉能力 × 左尾毁灭风险（倒数）。
    mechanism: 贝叶斯（更新）× 泊松（等待）× 幂律（右尾捕捉）× 左尾防护（避免毁灭）→ 四项乘积 → 任一项归零则长期结果归零 → 投资系统需同时建设四项能力而非偏废。
    prerequisites:
