  - unit_id: math-power-005
    type: anti_pattern
    claim: 把曾经的右尾资产神圣化、把方法变成身份、把主题变成宗教，是市场最擅长惩罚的失败模式。
    mechanism: 资产曾带来巨大收益 → 投资人将其身份化 → 即使结构条件变化仍死守 → 市场重新定价时不愿更新 → 类似信仰化持有（与 bayes-002 同构但更严重，因为右尾的财富记忆更深）。
