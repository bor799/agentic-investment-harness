judgment:
  one_line: >
    事前证据只支持"IP/海外改善毛利"的假设，不支持把它当经营胜率已通过；
    同店、海外直营单店模型与自有/授权 IP 经济三件关键证据全部缺失，硬门 H_B 处于 unknown，
    浮亏状态下的处理只能走"不加仓"或"降级或退出"，不允许加仓/抄底/卖 Put 降成本。
  money_source: 认知差钱（市场把"全球 IP 零售平台"叙事当作利润已兑现，与实际同店/直营单店模型未验证之间可能存在预期差） + 部分基本面钱（海外直营毛利改善若能兑现）
  happening_now: >
    事前信息仅说明"已买入并持有 + 浮亏约 32%"。无同店、无直营单店模型、无自有/授权 IP 单位经济数据 →
    当前没有事前证据表明经营假设正在落地；H_L 持有期内包含 IP 授权续约风险、海外扩张 Capex/same-store 周期、
    以及创始人与永辉资本配置相关的关联交易/治理风险窗口。
  strongest_support_evidence: >
    case 的 evidence_used 仅有"名创深度分析 + IP 价值笔记 + MINISO_DEEP_RESEARCH"三类二手研究素材，
    共同根（同根研究族）只能生成"持续经营"假设，无法独立验证经营胜率。
    可称最强的事前支持只是：海外业务确实存在、IP 联名确实在产品上可见——这构成假设而非证据。
  strongest_counter_evidence: >
    evidence_missing 字段自身列出三项硬缺失：国内同店、海外直营单店模型、IP 自有/授权经济。
    按 COMPANY_FUNDAMENTALS 失败条件（增长不能留下利润和现金）与典型伪证据表（"创始人可信只能生成持续性假设，必须由数字验证"），
    thesis_before_action 实际上是用叙事 + 创始人信任替代了财务验证。
  key_unknown: >
    (1) 自有 IP vs 独家 IP vs 授权 IP 三类收入占比和毛利率结构；
    (2) 海外直营门店单店回收周期与 Capex 强度；
    (3) 国内同店在宏观弱消费下的真实趋势；
    (4) 永辉资本配置与上市公司主体之间的现金流关联。
    四项任一不澄清，H_B 无法从 unknown 抬升。
  action: 不加仓  # 既有持仓不加风险；如需更激进反应应走"降级或退出"，但事前证据未达"thesis 已被推翻"，故停在"不加仓"
  next_verification_signal: >
    下一份财报必须差分以下：海外直营同店、海外经营利润率（非调整后）、IP 相关收入按自有/独家/授权三层拆分的毛利率、
    永辉相关资本支出与关联交易披露、经营现金流 vs 净利润勾稽。任一项失守 → 升级为"降级或退出"。
  H_B: unknown  # 三项关键证据缺失，经营胜率未被独立数字验证；不能从"创始人可信 + IP 叙事"抬升 H_B
  H_R: mixed  # 价格已下跌 32%，从纯赔率角度绝对跌幅提供了一定空间；但未提供反推情景（市场当前隐含什么），uncalibrated
  H_L: soft_warn  # 持有期内风险：IP 授权续约、海外 Capex 周期、永辉治理与关联交易、宏观弱消费；软探测器，不阻止动作但需列明
  H_C: pass_with_caveat  # 400 股成本 HK$36.20，绝对金额损失可承受（仓位票本身未失败）；但若叠加行为风险（亏损后加仓）则降级为 fail
  failure_condition: >
    任一财报季显示：海外直营经营利润率持续为负且无收窄趋势；或国内同店连续两季下滑；
    或自有 IP 收入占比无法支撑"IP 平台"叙事（仍以授权零售为主）；或永辉资本配置对上市公司现金流形成持续拖累。
    → 触发即升级为"降级或退出"。

