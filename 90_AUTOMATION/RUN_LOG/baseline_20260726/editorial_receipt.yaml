## 4. P5 修改 proposal（最高 ROI，聚焦最大失败）

```yaml
proposed_skill_changes:
  - rank: 1
    target_file: 02_术/SKILLS/EXPECTATIONS_VALUATION.md
    target_section: 新增 §H_R 反推情景执行清单
    source_units:
      - 赚谁的钱:money-source-009 (反推 market_implied 强制阈值)
      - 股价三层肉:stock-three-layer-001 (三层肉作为反推框架)
      - 股价三层肉:stock-three-layer-010 (下一年增速可信度)
    baseline_failures_addressed:
      - case_tinci H_R=unknown
      - case_horizon H_R=fail 无锚
      - case_miniso H_R=uncalibrated
      - case_lmnd H_R=unknown
      - case_popmarket H_R 缺 implied growth
    proposed_content_summary: |
      新增一节"反推情景执行清单"，作为 H_R 从 unknown/mixed 升级到 calibrated 的必经步骤。
      每个标的必须输出：
        - market_implied_growth（市场隐含增速，由当前估值反推）
        - market_implied_margin（市场隐含利润率）
        - market_implied_dur（市场隐含增长持续期）
        - money_source_breakdown（按三层肉分解：内在价值 / 流动性溢价 / 风险偏好）
        - reverse_engineering_pass: true|false
      反推未做 → H_R 必须 unknown，不允许 mixed/calibrated。
    confidence_in_proposal: high
    rollback_cost: low（一个新增章节，不改既有结构）

  - rank: 2
    target_file: 02_术/SKILLS/EXPECTATIONS_VALUATION.md
    target_section: 新增 §money_source 三空诊断
    source_units:
      - 赚谁的钱:money-source-008 (money_source 三空结构化)
    baseline_failures_addressed:
      - case_miniso money_source 含糊
      - case_horizon money_source 未拆
      - case_tinci money_source 未拆
    proposed_content_summary: |
      money_source 字段从字符串升级为结构：
        money_source:
          primary: 企业增长 | 估值重估 | 流动性 | 事件 | 套利
          payer: 谁在经济层面付钱
          marginal_buyer: 谁是股票的边际买家
          market_belief: 市场当前相信什么
          disconfirming_signal: 什么事实证明判断错误
      四项任一空白 → money_source 标 uncalibrated，H_R 不能升级。
    confidence_in_proposal: high
    rollback_cost: low

  - rank: 3
    target_file: 02_术/SKILLS/EXPECTATIONS_VALUATION.md
    target_section: 新增 §证据同根性诊断
    source_units:
      - 三大数学模型:math-bayes-003 (独立证据 vs 同根回声)
      - 赚谁的钱:money-source-008 (同根性 → 三空)
    baseline_failures_addressed:
      - case_miniso 同根研究族（深度分析 + IP 笔记 + DEEP_RESEARCH 同根）被当多源
      - case_tinci 产业链口径证据未分层
    proposed_content_summary: |
      新增"证据同根性诊断"清单：
        - 每条 evidence 必须标 source_root_id（同根 ID）
        - 同 source_root_id 的多条 evidence 只能算 1 个独立证据
        - 独立证据数 < 2 → H_B 不允许从 unknown 升级
    confidence_in_proposal: high
    rollback_cost: low
```

